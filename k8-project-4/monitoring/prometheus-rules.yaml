apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: order-service-alerts
  namespace: monitoring
  labels:
    release: kubeprostack
    role: alert-rules
spec:
  groups:
    - name: order.rules
      rules:
        # Test amaçlı: 0.05s üzeri her gecikmede 15 sn sonra tetiklenir
        - alert: HighPaymentLatency
          expr: payment_gateway_latency_seconds{namespace="production"} > 0.05
          for: 15s
          labels:
            severity: warning
            tier: web
          annotations:
            summary: "Yuksek odeme gecikmesi saptandi"
            description: "Gecikme 50ms esigini asti."

        # Pod'lar 0'a indiğinde (hedef yok olduğunda) 15 sn sonra tetiklenir
        - alert: OrderServiceDown
          expr: absent(up{job="production/order-metrics-servicemonitor"} == 1)
          for: 15s
          labels:
            severity: critical
            tier: web
          annotations:
            summary: "Siparis servisi podlari bulunamiyor"
            description: "Scrape hedefinde hicbir aktif pod yok."