apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: order-service-alerts
  namespace: production
  labels:
    # Prometheus Operator'ün kuralı yakalaması için zorunlu etiket:
    release: kubeprostack
    role: alert-rules
spec:
  groups:
    - name: order.rules
      rules:
        # 1. Kural: Yüksek Ödeme Gecikmesi (SLO İhlali)
        - alert: HighPaymentLatency
          expr: payment_gateway_latency_seconds{namespace="production"} > 0.35
          for: 1m
          labels:
            severity: warning
            tier: web
          annotations:
            summary: "Yuksek odeme ag gecidi gecikmesi saptandi"
            description: "Pod {{ $labels.instance }} uzerinde odeme gecikmesi 350ms esigini asti (Guncel deger: {{ $value }}s)."

        # 2. Kural: Servis Erisilemezligi (SLA Kesintisi)
        - alert: OrderServiceDown
          expr: up{job="production/order-metrics-servicemonitor"} == 0
          for: 30s
          labels:
            severity: critical
            tier: web
          annotations:
            summary: "Siparis metrik servisi down durumda"
            description: "Pod {{ $labels.instance }} metrik veremiyor veya tamamen dustu."