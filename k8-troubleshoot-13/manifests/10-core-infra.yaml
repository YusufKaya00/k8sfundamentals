apiVersion: v1
kind: Secret
metadata:
  name: novaedge-db-secret
  namespace: novaedge-prod
type: Opaque
stringData:
  database-password: "NovaEdgeSecurePass2026!"
---
apiVersion: v1
kind: Service
metadata:
  name: novaedge-db
  namespace: novaedge-prod
  labels:
    app.kubernetes.io/name: novaedge-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
  selector:
    app.kubernetes.io/name: novaedge-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: novaedge-db
  namespace: novaedge-prod
  labels:
    app.kubernetes.io/name: novaedge-db
spec:
  serviceName: novaedge-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novaedge-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novaedge-db
        tier: database
    spec:
      nodeSelector:
        tier: database
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: novaedge_db
            - name: POSTGRES_USER
              value: novaedge_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novaedge-db-secret
                  key: database-password
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: oci-bv
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: novaedge-redis
  namespace: novaedge-prod
  labels:
    app.kubernetes.io/name: novaedge-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: novaedge-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novaedge-redis
  namespace: novaedge-prod
  labels:
    app.kubernetes.io/name: novaedge-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novaedge-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novaedge-redis
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
