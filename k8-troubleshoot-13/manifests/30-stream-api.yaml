apiVersion: v1
kind: ConfigMap
metadata:
  name: stream-api-config
  namespace: novaedge-prod
  labels:
    app.kubernetes.io/name: stream-api
data:
  PORT: "8080"
  STREAM_BUFFER_SIZE: "128"
  REDIS_HOST: "novaedge-redis"
  REDIS_PORT: "6379"
  DB_HOST: "novaedge-db"
  DB_PORT: "5432"
  server.py: |
    import os
    import sys
    import json
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler

    port = int(os.environ.get("PORT", 8080))
    buffer_size = int(os.environ.get("STREAM_BUFFER_SIZE", 0))

    if buffer_size < 1024:
        sys.stderr.write(f"FATAL: Invalid STREAM_BUFFER_SIZE={buffer_size}. Minimum allocation requires 1024 bytes for ring buffer.\n")
        sys.exit(1)

    print(f"Stream API initializing with ring buffer size {buffer_size} on port {port}...")

    class StreamHandler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"status":"ok","service":"stream-api"}\n')
            elif self.path.startswith("/stream"):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                resp = {
                    "status": "active",
                    "stream_id": f"stream_{int(time.time())}",
                    "buffer_bytes": buffer_size,
                    "pipeline": "ingested"
                }
                self.wfile.write((json.dumps(resp) + "\n").encode())
            else:
                self.send_response(404)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"error":"not_found"}\n')

    server = HTTPServer(("0.0.0.0", port), StreamHandler)
    server.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: stream-api
  namespace: novaedge-prod
  labels:
    app.kubernetes.io/name: stream-api
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: stream-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-api
  namespace: novaedge-prod
  labels:
    app.kubernetes.io/name: stream-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stream-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-api
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python3", "/etc/app/server.py"]
          envFrom:
            - configMapRef:
                name: stream-api-config
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: stream-api-config
