replicaCount: 1

image:
  repository: ghcr.io/edge-controllers/edge-ingress
  tag: 1.25.4-alpine
  pullPolicy: IfNotPresent

controller:
  containerPort: 8080
  ingressClass: edge-ingress

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  nodePort: 30088
  externalTrafficPolicy: Cluster

nodeSelector:
  tier: web

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
