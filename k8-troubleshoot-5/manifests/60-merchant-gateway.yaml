apiVersion: v1
kind: Service
metadata:
  name: merchant-gateway-np
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: merchant-gateway
    app.kubernetes.io/part-of: apex-pay
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: merchant-gateway
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-gateway
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: merchant-gateway
    app.kubernetes.io/part-of: apex-pay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: merchant-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: merchant-gateway
        app.kubernetes.io/part-of: apex-pay
    spec:
      nodeSelector:
        tier: web
      containers:
      - name: gateway
        image: docker.io/library/nginx:1.25-alpine
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: gateway-nginx-conf
