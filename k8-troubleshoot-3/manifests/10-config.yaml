apiVersion: v1
kind: ConfigMap
metadata:
  name: api-code
  namespace: apex-prod
  labels:
    app.kubernetes.io/part-of: apexpay
data:
  server.py: |
    import http.server
    import socketserver
    import os
    import sys
    import time
    import json
    import socket

    bind_host = os.environ.get("BIND_HOST", "0.0.0.0")
    port = int(os.environ.get("PORT", "8080"))
    db_host = os.environ.get("DB_HOST", "ledger-db")
    db_port = int(os.environ.get("DB_PORT", "5432"))
    redis_host = os.environ.get("REDIS_HOST", "transaction-cache")
    redis_port = int(os.environ.get("REDIS_PORT", "6379"))

    print(f"[API] Initializing ApexPay Engine on {bind_host}:{port}...", flush=True)

    def probe_tcp(host, port_num, timeout=1.0):
        try:
            s = socket.create_connection((host, port_num), timeout=timeout)
            s.close()
            return True
        except Exception:
            return False

    class PaymentHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            sys.stdout.write(f"[{self.log_date_time_string()}] {self.address_string()} - {format%args}\n")
            sys.stdout.flush()

        def do_GET(self):
            if self.path == "/healthz":
                time.sleep(1.2)
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ok", "service": "payment-api"}).encode("utf-8"))
            elif self.path == "/ready":
                db_ok = probe_tcp(db_host, db_port)
                redis_ok = probe_tcp(redis_host, redis_port)
                if db_ok and redis_ok:
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    resp = {
                        "status": "ready",
                        "ledger_database": "connected",
                        "idempotency_cache": "connected"
                    }
                    self.wfile.write(json.dumps(resp).encode("utf-8"))
                else:
                    self.send_response(503)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    resp = {
                        "status": "not_ready",
                        "ledger_database": "connected" if db_ok else "unreachable",
                        "idempotency_cache": "connected" if redis_ok else "unreachable"
                    }
                    self.wfile.write(json.dumps(resp).encode("utf-8"))
            elif self.path in ["/api/transactions", "/transactions", "/"]:
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                txs = [
                    {"tx_id": "APX-88019", "account": "ACC-9921", "amount": 1420.50, "currency": "EUR", "status": "SETTLED"},
                    {"tx_id": "APX-88020", "account": "ACC-1044", "amount": 89.00, "currency": "USD", "status": "SETTLED"},
                    {"tx_id": "APX-88021", "account": "ACC-3118", "amount": 5400.00, "currency": "EUR", "status": "AUTHORIZED"}
                ]
                self.wfile.write(json.dumps(txs).encode("utf-8"))
            else:
                self.send_response(404)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"error": "not_found"}).encode("utf-8"))

    with socketserver.TCPServer((bind_host, port), PaymentHandler) as httpd:
        print(f"[API] Server listening and accepting traffic on {bind_host}:{port}", flush=True)
        httpd.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: apex-prod
  labels:
    app.kubernetes.io/part-of: apexpay
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"online"}\n';
        }

        location /api/ {
            proxy_pass http://payment-api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>ApexPay Gateway</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #090d16; color: #f1f5f9; }
            .panel { background: #131b2e; padding: 24px; border-radius: 8px; border: 1px solid #1e293b; max-width: 600px; margin: auto; }
            h1 { color: #10b981; font-size: 22px; }
            .status { color: #38bdf8; font-weight: bold; }
        </style>
    </head>
    <body>
        <div class="panel">
            <h1>ApexPay Settlement Gateway</h1>
            <p>Status: <span class="status">Active</span></p>
            <p>Financial ledger gateway operational.</p>
        </div>
    </body>
    </html>
