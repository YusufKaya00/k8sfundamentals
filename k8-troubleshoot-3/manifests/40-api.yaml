apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: apex-prod
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: apexpay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
        app.kubernetes.io/part-of: apexpay
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: payment-api
          image: docker.io/library/python:3.11-alpine
          command:
            - python3
            - -u
            - /app/server.py
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: "4"
              memory: "128Mi"
            limits:
              cpu: "4"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: code-volume
              mountPath: /app/server.py
              subPath: server.py
            - name: settings-volume
              mountPath: /app
      volumes:
        - name: code-volume
          configMap:
            name: api-code
        - name: settings-volume
          configMap:
            name: api-settings
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: apex-prod
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: apexpay
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: payment-api
