apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: production
type: Opaque
stringData:
  POSTGRES_USER: "app_user"
  POSTGRES_PASSWORD: "SuperSecurePassword123!"
  POSTGRES_DB: "production_db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  APP_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "INFO"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  CACHE_ENABLED: "true"