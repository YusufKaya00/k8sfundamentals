apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd-role
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: production
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logdaemonset
  namespace: production          # ServiceAccount ile aynı namespace
  labels:
    app: fluentd-logging
spec:
  selector:
    matchLabels:
      name: fluentd-elasticsearch
  template:
    metadata:
      labels:
        name: fluentd-elasticsearch
    spec:
      serviceAccountName: fluentd
      tolerations:
        # Hem eski master hem yeni control-plane taint'lerini tolere et
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        # Labındaki production worker node taint'i
        - key: dedicated
          operator: Equal
          value: production
          effect: NoSchedule
      containers:
        - name: fluentd-elasticsearch
          image: fluent/fluentd-kubernetes-daemonset:v1-debian-elasticsearch
          env:
            # Elasticsearch yoksa pod'un crash olmasını engellemek için host/port belirtilebilir
            - name: FLUENT_ELASTICSEARCH_HOST
              value: "elasticsearch-logging.production.svc.cluster.local"
            - name: FLUENT_ELASTICSEARCH_PORT
              value: "9200"
            - name: FLUENT_ELASTICSEARCH_SCHEME
              value: "http"
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 200Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            # containerd loglarının tutulduğu dizin
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlogpods
          hostPath:
            path: /var/log/pods