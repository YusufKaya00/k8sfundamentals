# =============================================================================
# In-Cluster API Istemcisi
# - "api-reader" ServiceAccount'u yalnizca production namespace'indeki
#   Pod ve Job nesnelerini "get" / "list" edebilir.
# - "api-client" pod'u bu ServiceAccount'un token'i ile Kubernetes API'sine
#   HTTPS (CA dogrulamali) istek atar.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-reader
  namespace: production
  labels:
    app: api-client
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-job-reader
  namespace: production
  labels:
    app: api-client
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-reader-binding
  namespace: production
  labels:
    app: api-client
subjects:
  - kind: ServiceAccount
    name: api-reader
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-job-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: api-client
  namespace: production
  labels:
    app: api-client
spec:
  serviceAccountName: api-reader
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          APISERVER="https://kubernetes.default.svc"
          SA_DIR="/var/run/secrets/kubernetes.io/serviceaccount"
          NS="$(cat ${SA_DIR}/namespace)"
          TOKEN="$(cat ${SA_DIR}/token)"
          echo "[api-client] ${NS} namespace'indeki pod'lar sorgulaniyor..."
          curl -sS --cacert "${SA_DIR}/ca.crt" \
               -H "Authorization: Bearer ${TOKEN}" \
               "${APISERVER}/api/v1/namespaces/${NS}/pods" \
            | grep -E '"(name|phase)"' | head -n 40
          echo "[api-client] Hazir. 'kubectl exec' ile manuel sorgu yapabilirsiniz."
          while true; do sleep 3600; done
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
