---
# ==============================================================================
# FAZ 2: RKE2 CONTROL PLANE (MASTER), INGRESS WEBHOOK VE LOCAL-PATH CSI KURULUMU
# Dosya: playbooks/02-rke2-master.yml
# Hedef: vm-master (Standard_B2s_v2 — 2 vCPU / 8 GB RAM — 10.20.1.4)
# ==============================================================================
# MİMARİ AMAÇ:
# Bu playbook kümemizin beyni olan "vm-master" sunucusunda RKE2 Server (`v1.31.2+rke2r1`)
# kontrol düzlemini ayağa kaldırır ve üretim ortamlarında sıkça karşılaşılan
# iki kritik problemi (Race Condition & Tainted PVC Provisioning) çözer:
#   1. NGINX Ingress Admission Webhook Yarış Durumu (Race Condition): RKE2 ilk
#      başladığında API Server hemen yanıt verir ancak `rke2-ingress-nginx-controller`
#      pod'u henüz ayağa kalkmamıştır. Bu sırada Ingress içeren bir Helm chart
#      (Rancher, ArgoCD, Grafana) kurulursa `failed calling webhook "validate.nginx.ingress.kubernetes.io"`
#      hatası alınır. Bu yüzden DaemonSet tamamen Ready olana kadar beklenir.
#   2. Taint'li Worker Düğümlerde Local-Path PVC Hatası: Veritabanı düğümlerimizde
#      `NoSchedule` Taint'leri olduğu için, Local-Path Provisioner yeni bir disk
#      klasörü oluşturmak üzere geçici `helper-pod` başlattığında bu pod Taint'e
#      takılıp `Pending` kalır ve veritabanları asla başlayamaz! Bunu önlemek için
#      hem Provisioner Deployment'ına hem de `helperPod.yaml` ConfigMap'ine
#      `tolerations: [{operator: Exists}]` yaması uygulanır.
# ==============================================================================

- name: "Faz 2: vm-master Üzerinde RKE2 Server, Helm 3 ve Local-Path Storage Kurulumu"
  hosts: master
  become: true
  vars:
    rke2_version: "v1.31.2+rke2r1"
    kubectl_cmd: "/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
    helm_cmd: "KUBECONFIG=/etc/rancher/rke2/rke2.yaml /usr/local/bin/helm"

  tasks:
    # --------------------------------------------------------------------------
    # 1. ADIM: RKE2 SERVER KONFİGÜRASYONU (/etc/rancher/rke2/config.yaml)
    # --------------------------------------------------------------------------
    # - tls-san (Subject Alternative Name): Kubernetes API Server (Port 6443) TLS
    #   sertifikasının sadece 127.0.0.1 için değil, aynı zamanda Azure Public IP
    #   (`master_public_ip`), VNet Özel IP (`10.20.1.4`) ve sunucu adı (`vm-master`)
    #   için de geçerli olmasını sağlar. Aksi halde dışarıdan kubectl bağlandığında
    #   `x509: certificate is valid for 10.43.0.1, not <PUBLIC_IP>` hatası verir.
    # - cni: canal: Flannel (VXLAN Overlay) hızı ile Calico (NetworkPolicy güvenlik
    #   duvarı motoru) yeteneklerini birleştiren varsayılan kurumsal CNI eklentisi.
    # - write-kubeconfig-mode: "0644": Kubeconfig dosyasının izinlerini ayarlar.
    - name: "RKE2 konfigürasyon dizinini (/etc/rancher/rke2) oluştur"
      file:
        path: /etc/rancher/rke2
        state: directory
        mode: '0755'

    - name: "RKE2 Server yapılandırma dosyasını (/etc/rancher/rke2/config.yaml) oluştur"
      copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          tls-san:
            - "{{ master_public_ip }}"
            - "10.20.1.4"
            - "vm-master"
          cni: canal
          write-kubeconfig-mode: "0644"
        mode: '0644'

    # --------------------------------------------------------------------------
    # 2. ADIM: RKE2 SERVER KURULUMU VE SYSTEMD SERVİSİNİN BAŞLATILMASI
    # --------------------------------------------------------------------------
    # Resmi RKE2 kurulum betiği binary dosyalarını ve systemd unit dosyasını
    # (`rke2-server.service`) indirir. `creates: /usr/local/bin/rke2` sayesinde
    # playbook tekrar çalıştırıldığında (idempotency) gereksiz yere yeniden indirme yapmaz.
    - name: "RKE2 Server ({{ rke2_version }}) ikili dosyalarını indir ve kur"
      shell: "curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION={{ rke2_version }} sh -"
      args:
        creates: /usr/local/bin/rke2

    - name: "rke2-server systemd servisini etkinleştir ve başlat"
      systemd:
        name: rke2-server
        state: started
        enabled: true

    # --------------------------------------------------------------------------
    # 3. ADIM: KUBERNETES API SERVER VE DÜĞÜM HAZIRLIK BEKLEMESİ
    # --------------------------------------------------------------------------
    # RKE2 ilk başladığında gömülü containerd'yi başlatır, ardından etcd,
    # kube-apiserver, kube-controller-manager ve kube-scheduler static pod'larını
    # ayağa kaldırır. API Server yanıt verene kadar yoklama (polling) yapıyoruz.
    - name: "Kubernetes API Server'ın yanıt vermesini ve vm-master'ın Ready olmasını bekle"
      shell: "{{ kubectl_cmd }} get nodes | grep -w 'Ready'"
      register: master_ready
      until: master_ready.rc == 0
      retries: 36
      delay: 10
      changed_when: false

    # --------------------------------------------------------------------------
    # 4. ADIM: KUBECTL SYMLINK, KUBECONFIG VE HELM 3 KURULUMU
    # --------------------------------------------------------------------------
    # RKE2, güvenlik standartları gereği kendi `kubectl` ve `crictl` araçlarını
    # `/var/lib/rancher/rke2/bin/` dizinine kurar. Bunları `/usr/local/bin` altına
    # sembolik bağ (symlink) olarak ekleyerek sistem genelinde doğrudan çalışmasını sağlıyoruz.
    - name: "kubectl ve crictl araçlarını /usr/local/bin altına sembolik bağla (symlink)"
      file:
        src: "/var/lib/rancher/rke2/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kubectl
        - crictl

    - name: "Kullanıcı (/home/ysf/.kube) dizinini oluştur"
      file:
        path: "/home/{{ ansible_user | default('ysf') }}/.kube"
        state: directory
        owner: "{{ ansible_user | default('ysf') }}"
        group: "{{ ansible_user | default('ysf') }}"
        mode: '0755'

    - name: "Kubeconfig dosyasını /home/ysf/.kube/config konumuna kopyala ve yetkilendir"
      copy:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "/home/{{ ansible_user | default('ysf') }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user | default('ysf') }}"
        group: "{{ ansible_user | default('ysf') }}"
        mode: '0600'

    - name: "Helm 3 paket yöneticisini indir ve /usr/local/bin/helm olarak kur"
      shell: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod 700 get_helm.sh
        ./get_helm.sh
        rm -f get_helm.sh
      args:
        creates: /usr/local/bin/helm

    # --------------------------------------------------------------------------
    # 5. ADIM: NGINX INGRESS ADMISSION WEBHOOK YARIŞ DURUMU (RACE CONDITION) BEKLEMESİ
    # --------------------------------------------------------------------------
    # ÇOK KRİTİK MİMARİ DETAY (ADMISSION WEBHOOK RACE CONDITION):
    # RKE2, `kube-system` namespace'i içinde bir HelmController aracılığıyla
    # `rke2-ingress-nginx` chart'ını arka planda otomatik kurar. Bu kurulum sırasında
    # Kubernetes API'sine bir `ValidatingWebhookConfiguration` (`validate.nginx.ingress.kubernetes.io`)
    # kaydedilir. Eğer `daemonset/rke2-ingress-nginx-controller` pod'u henüz `Running (1/1)`
    # durumuna geçmeden Rancher, ArgoCD veya Grafana gibi içinde `kind: Ingress` barındıran
    # bir bileşen kurulmaya çalışılırsa, API Server doğrulama isteğini NGINX Webhook
    # servisine gönderir ancak arkada çalışan pod olmadığı için `connection refused`
    # hatasıyla kurulum çöker! Bu görev, Ingress Controller tamamen hazır olana kadar
    # otomasyonu güvenle bekletir.
    - name: "daemonset/rke2-ingress-nginx-controller oluşana kadar bekle"
      shell: "{{ kubectl_cmd }} get daemonset rke2-ingress-nginx-controller -n kube-system"
      register: ingress_ds_exists
      until: ingress_ds_exists.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: "RKE2 NGINX Ingress Controller ve Admission Webhook'un tamamen hazır olmasını bekle"
      shell: "{{ kubectl_cmd }} rollout status daemonset/rke2-ingress-nginx-controller -n kube-system --timeout=240s"
      register: ingress_rollout
      until: ingress_rollout.rc == 0
      retries: 15
      delay: 10
      changed_when: false

    # --------------------------------------------------------------------------
    # 6. ADIM: LOCAL-PATH PROVISIONER (v0.0.30) VE TAINT TOLERASYON YAMASI
    # --------------------------------------------------------------------------
    # NEDEN BU YAMA (PATCH) OLMAZSA VERİTABANLARI VE KAFKA BAŞLAYAMAZ?
    # RKE2 varsayılan olarak bir StorageClass ile gelmez. Dinamik PVC (PersistentVolumeClaim)
    # oluşturmak için Rancher'ın resmi `local-path-provisioner` (`v0.0.30`) sürücüsünü
    # kuruyoruz.
    # Ancak `local-path-provisioner` çalışma mantığı şöyledir:
    # Örneğin `vm-worker-stream` üzerinde Kafka bir PVC (`4Gi`) istediğinde,
    # `local-path-provisioner` o worker düğümünde `/var/lib/rancher/local-path-provisioner/...`
    # dizinini oluşturmak için `helper-pod` adında geçici bir BusyBox pod'u başlatır.
    # Biz `04-node-isolation.yml` adımında `vm-worker-stream`, `vm-worker-sql` ve
    # `vm-worker-nosql` düğümlerine `dedicated=*:NoSchedule` Taint'i basacağız.
    # Eğer `helperPod.yaml` şablonunda `tolerations: [{operator: Exists}]` YOKSA,
    # Kubernetes Scheduler bu yardımcı pod'u Taint'li veritabanı sunucusuna yerleştiremez!
    # Yardımcı pod `Pending` kalır, PVC `Pending` kalır ve Kafka/PostgreSQL/MongoDB/Redis
    # sonsuza dek `ContainerCreating` / `Pending` durumunda kilitlenir!
    # Aşağıdaki yama ile hem `local-path-provisioner` ana pod'una hem de onun doğurduğu
    # `helper-pod` şablonuna tüm Taint'leri aşma (`operator: Exists`) yetkisi veriyoruz.
    - name: "Rancher Local-Path Provisioner (v0.0.30) manifestosunu uygula"
      shell: "{{ kubectl_cmd }} apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml"
      changed_when: true

    - name: "local-path-provisioner Deployment'ına tüm Taint'leri tolere etme yetkisi (operator: Exists) ekle"
      shell: |
        {{ kubectl_cmd }} patch deployment local-path-provisioner -n local-path-storage --type='json' \
          -p='[{"op": "add", "path": "/spec/template/spec/tolerations", "value": [{"operator": "Exists"}]}]'
      changed_when: true

    - name: "local-path-config ConfigMap içindeki helperPod.yaml şablonuna Taint Tolerasyonu ekle"
      shell: |
        {{ kubectl_cmd }} patch configmap local-path-config -n local-path-storage --type merge -p '{
          "data": {
            "helperPod.yaml": "apiVersion: v1\nkind: Pod\nmetadata:\n  name: helper-pod\nspec:\n  tolerations:\n  - operator: Exists\n  containers:\n  - name: helper-pod\n    image: busybox:stable\n    imagePullPolicy: IfNotPresent\n"
          }
        }'
      changed_when: true

    - name: "local-path StorageClass'ını kümenin varsayılan (default) depolama sınıfı olarak işaretle"
      shell: |
        {{ kubectl_cmd }} patch storageclass local-path \
          -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      changed_when: true

    - name: "local-path-provisioner pod'unun hazır olmasını bekle"
      shell: "{{ kubectl_cmd }} rollout status deployment/local-path-provisioner -n local-path-storage --timeout=120s"
      changed_when: false
