# ==============================================================================
# GITLAB RUNNER (gitlab/gitlab-runner) — DEVSECOPS CI/CD İŞLEYİCİSİ ŞABLONU
# ==============================================================================
# MİMARİ AMAÇ:
# Bu Helm değerleri dosyası, GitLab CI/CD boru hattındaki (.gitlab-ci.yml)
# 4 aşamayı (Rootless Buildah İmaj İnşası -> Trivy Güvenlik Taraması -> Docker Hub Push
# -> GitOps Helm Tag Güncellemesi) kendi RKE2 kümemiz içinde (Self-Hosted Kubernetes
# Executor olarak) çalıştırmak istediğimizde kullanılan üretim şablonudur.
#
# NEDEN vm-worker-app ÜZERİNE KONUMLANDIRILIR?
# CI/CD derleme ve güvenlik taraması (Trivy DB indirme + imaj katmanı analizi)
# geçici (ephemeral) pod'lar oluşturur. Veritabanı ve Kafka düğümlerimizin disk/CPU
# performansını etkilememesi için hem GitLab Runner yöneticisi hem de onun doğurduğu
# CI Job pod'ları "tier: app" etiketli "vm-worker-app" düğümüne yönlendirilir.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GITLAB SUNUCUSU VE YENİ NESİL RUNNER TOKEN (glrt-...)
# ------------------------------------------------------------------------------
# GitLab.com veya kendi kurumsal GitLab sunucunuzun adresi:
gitlabUrl: https://gitlab.com/

# ÖNEMLİ (Yeni GitLab Runner Mimarisi):
# GitLab artık eski "runnerRegistrationToken" yerine "New project runner" ekranından
# üretilen "glrt-..." ile başlayan "runnerToken" (Authentication Token) kullanır.
# Kurulum sırasında --set runnerToken="glrt-..." ile dışarıdan geçirilir:
runnerToken: "REPLACE_WITH_GLRT_TOKEN"

# ------------------------------------------------------------------------------
# 2. EŞZAMANLI İŞ (CONCURRENCY) VE KONTROL ARALIĞI
# ------------------------------------------------------------------------------
# Standard_B1ms (1 vCPU / 2 GB RAM) boyutundaki vm-worker-app düğümünü aşırı
# yüklememek için aynı anda en fazla 2 CI/CD işinin (Job) çalışmasına izin veriyoruz.
concurrent: 2
checkInterval: 5

# ------------------------------------------------------------------------------
# 3. RBAC (ROL TABANLI ERİŞİM KONTROLÜ) YETKİLERİ
# ------------------------------------------------------------------------------
# ÇOK ÖNEMLİ: GitLab Runner'ın Kubernetes Executor modunda çalışabilmesi için
# RKE2 API Server'a bağlanıp dinamik olarak Job Pod'ları, Secret'lar ve ConfigMap'ler
# oluşturma/silme yetkisine (ServiceAccount + Role + RoleBinding) ihtiyacı vardır.
rbac:
  create: true

# ------------------------------------------------------------------------------
# 4. RUNNER YÖNETİCİ POD'U KAYNAK VE DÜĞÜM PLANLAMASI
# ------------------------------------------------------------------------------
# Runner ana pod'unun "vm-worker-app" sunucusunda çalışmasını sağlar:
nodeSelector:
  tier: app

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# ------------------------------------------------------------------------------
# 5. KUBERNETES EXECUTOR VE GEÇİCİ CI/CD JOB POD'U KONFİGÜRASYONU
# ------------------------------------------------------------------------------
runners:
  # CI/CD işlerinin oluşturulacağı özel Kubernetes ayarları (config.toml şablonu):
  # - RKE2 containerd üzerinde Buildah'ın (--storage-driver=vfs --isolation=chroot)
  #   veya Kaniko/Trivy'nin sorunsuz çalışması için privileged = true ve
  #   tier = "app" node_selector tanımlanmıştır.
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "ubuntu:24.04"
        privileged = true
        cpu_request = "100m"
        cpu_limit = "600m"
        memory_request = "128Mi"
        memory_limit = "768Mi"
        helper_cpu_request = "25m"
        helper_memory_request = "64Mi"
        [runners.kubernetes.node_selector]
          tier = "app"

