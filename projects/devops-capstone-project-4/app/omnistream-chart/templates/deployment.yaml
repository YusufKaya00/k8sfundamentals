# ==============================================================================
# OMNISTREAM KUBERNETES DEPLOYMENT ŞABLONU (templates/deployment.yaml)
# ==============================================================================
# Bu şablon, `omnistream-app` mikroservisinin hangi imajla, hangi düğümde
# (`nodeSelector: tier=app`), hangi ortam değişkenleriyle (Kafka, Redis, PG, Mongo)
# ve hangi sağlık kontrolleriyle (Liveness/Readiness Probe) çalışacağını tanımlar.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8000 }}
              protocol: TCP
          # values.yaml altındaki `env:` bloğunu döngüyle (range) pod içine aktarır
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          # Liveness Probe: Uygulama kilitlenirse (deadlock) kubelet pod'u yeniden başlatır
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          # Readiness Probe: Uygulama hazır olmadan Service/Ingress trafiği pod'a yönlendirilmez
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # Kaynak Sınırları: 2 GB RAM'li `vm-worker-app` sunucusunda OOM (Out-Of-Memory) önler
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # Düğüm Seçici (NodeSelector): Pod'un yalnızca `tier=app` etiketli worker'da koşmasını sağlar
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
