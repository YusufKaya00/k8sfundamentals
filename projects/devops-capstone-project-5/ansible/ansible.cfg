# ==============================================================================
# ANSIBLE ÜRETİM KONFİGÜRASYONU (ansible.cfg) — RESILIENCESTREAM PROJE 5
# ==============================================================================
# MİMARİ AMAÇ:
# 3 sunuculu (`vm-master` + `vm-worker-data` + `vm-worker-app`) RKE2 kümemizi
# kurarken Ansible'ın SSH bağlantı hızını maksimuma çıkarmak, Bastion/Jump Host
# (ProxyCommand) üzerinden `vm-worker-data` (`10.30.1.5`) geçişlerinde takılmaları
# önlemek ve çıktıları okunaklı YAML formatında sunmak için özelleştirilmiştir.
#
# NEDEN PROD ORTAMINDA BÖYLEDİR VS LAB ORTAMI?
# - Prod'da: SSH bilinen sunucu anahtarları (`known_hosts`) merkezi bir SSH
#   Sertifika Otoritesi (HashiCorp Vault SSH CA) ile doğrulanır.
# - Lab'da: Bulut sunucuları `terraform destroy` / `apply` ile yeniden
#   oluşturulduğunda IP değişebildiği için `host_key_checking = False` ve
#   `UserKnownHostsFile=/dev/null` ile otomasyonun kesintisiz akması sağlanır.
# ==============================================================================

[defaults]
# Terraform'un (outputs.tf -> local_file) otomatik olarak ürettiği envanter dosyası:
inventory = hosts.ini

# Bulut ortamında (Azure) sunucular yeniden oluşturulduğunda SSH parmak izi (fingerprint)
# değiştiği için etkileşimli "Are you sure you want to continue connecting (yes/no)?"
# sorusunun otomasyonu durdurmasını engeller:
host_key_checking = False

# Hata durumunda dizini kirleten ".retry" dosyalarının oluşturulmasını kapatır:
retry_files_enabled = False

# Yavaş ağ veya yoğun disk I/O anlarında SSH zaman aşımını 30 saniyeye çıkarır:
timeout = 30

# Konsol çıktılarını tek satırlık sıkışık JSON yerine okunabilir çok satırlı YAML yapar:
stdout_callback = yaml

# Aynı anda tüm sunucularda paralel görev çalıştırabilmesi için fork sayısı:
forks = 10

[ssh_connection]
# PIPELINING (BORU HATTI OPTİMİZASYONU):
# Ansible normalde her görev için uzak sunucuda geçici bir Python dosyası oluşturup
# SFTP/SCP ile kopyalar ve çalıştırır. Pipelining = True yapıldığında Python betikleri
# doğrudan mevcut SSH standart girdisi (stdin) üzerinden bellekte çalıştırılır.
# Bu ayar SSH bağlantı sayısını %70 azaltır ve playbook süresini 3 kat hızlandırır!
pipelining = True

# SSH MULTIPLEXING (ÇOKLAMA) VE GÜVENLİK BAYRAKLARI:
# - ControlMaster=auto & ControlPersist=60s: İlk açılan SSH TCP soketini 60 saniye
#   boyunca açık tutar ve sonraki tüm Ansible görevlerini aynı tünel üzerinden geçirir
#   (özellikle özel `vm-worker-data` sunucusuna `vm-master` üzerinden ProxyCommand ile
#   atlarken her adımda tekrar TCP+SSH el sıkışması yapılmasını önler).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
