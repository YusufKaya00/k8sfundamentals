# ==============================================================================
# RESILIENCESTREAM HORIZONTAL POD AUTOSCALER ŞABLONU (templates/hpa.yaml)
# ==============================================================================
# Neden HorizontalPodAutoscaler (HPA)?
# Deney 05 (`StressChaos`) ve Deney 09 (`Black Friday` k6 yük testi) sırasında
# CPU kullanımı hedef eşiği (`%75`) aştığında `order-api` ve `payment-worker`
# pod kopya sayısını otomatik olarak artırarak gecikme (latency) SLO'sunu korur.
# ==============================================================================
{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-api-hpa
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: order-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-api
  minReplicas: {{ .Values.hpa.minReplicas | default 2 }}
  maxReplicas: {{ .Values.hpa.maxReplicas | default 4 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage | default 75 }}
---
{{- if .Values.workers.paymentWorker.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-worker-hpa
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: payment-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage | default 75 }}
{{- end }}
{{- end }}
