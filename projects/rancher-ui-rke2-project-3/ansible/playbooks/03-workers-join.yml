---
- name: "Worker Sunucularını RKE2 Kümesine Bağla"
  hosts: master
  become: true
  tasks:
    - name: "Master sunucusundan node-token'ı oku"
      slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: master_token_b64

    - name: "Token'ı set et"
      set_fact:
        cluster_token: "{{ master_token_b64.content | b64decode | trim }}"

- name: "Tüm Worker'larda rke2-agent Servisini Başlat"
  hosts: workers
  become: true
  vars:
    rke2_version: "v1.31.2+rke2r1"
  tasks:
    - name: "RKE2 konfigürasyon dizinini oluştur"
      file:
        path: /etc/rancher/rke2
        state: directory
        mode: '0755'

    - name: "Worker config.yaml dosyasını oluştur"
      copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          server: https://10.10.1.4:9345
          token: {{ hostvars['vm-master']['cluster_token'] }}
        mode: '0644'

    - name: "RKE2 Agent kurulum betiğini çalıştır"
      shell: "curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE=agent INSTALL_RKE2_VERSION={{ rke2_version }} sh -"
      args:
        creates: /usr/local/bin/rke2

    - name: "rke2-agent servisini etkinleştir ve başlat"
      systemd:
        name: rke2-agent
        state: started
        enabled: true
