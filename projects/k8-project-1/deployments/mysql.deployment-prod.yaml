apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  selector:
    matchLabels:
      app: mysql-backend
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql-backend
    spec:
      nodeSelector:
         kubernetes.io/role: worker1
      containers:
        - name: mysql
          image: mysql:5.6
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "500Mi"
              cpu: "500m"
          env:
            - name: MYSQL_ROOT_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: db_password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: db_username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: db_password
            - name: MYSQL_DATABASE
              value: wordpress
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      tolerations:
            - key: platform
              operator: Equal
              value: production
              effect: NoSchedule
              
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysqlclaim