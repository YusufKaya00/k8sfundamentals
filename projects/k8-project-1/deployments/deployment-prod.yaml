apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
spec:
  replicas: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-container
        image: ozgurozturknet/k8s:v1
        ports:
        - containerPort: 80
      livenessProbe:
         httpGet:
           path: /healthcheck
           port: 80,
      readinessProbe:
        httpGet:
         path: /ready
         port: 80
     