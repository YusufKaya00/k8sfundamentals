stages:
  - test

k8s-dynamic-pod-verification:
  stage: test
  image: docker.io/alpine:latest
  script:
    - echo "=== OKE KUBERNETES EXECUTOR DOGRULAMA ==="
    - uname -a
    - id
    - echo "Pod kaynaklari ve islemler kontrol ediliyor..."
