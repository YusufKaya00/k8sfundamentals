apiVersion: v1
kind: Secret
metadata:
  name: state-db-secret
  namespace: chronos-prod
  labels:
    app.kubernetes.io/name: state-db
    app.kubernetes.io/part-of: chronos
type: Opaque
stringData:
  POSTGRES_DB: chronos
  POSTGRES_USER: chronos_admin
  POSTGRES_PASSWORD: ChronosSecure2026!
---
apiVersion: v1
kind: Service
metadata:
  name: state-db
  namespace: chronos-prod
  labels:
    app.kubernetes.io/name: state-db
    app.kubernetes.io/part-of: chronos
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: state-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: state-db
  namespace: chronos-prod
  labels:
    app.kubernetes.io/name: state-db
    app.kubernetes.io/part-of: chronos
spec:
  serviceName: state-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: state-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: state-db
        app.kubernetes.io/part-of: chronos
        tier: database
    spec:
      nodeSelector:
        tier: database
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "database"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: state-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: state-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: state-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U chronos_admin -d chronos
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: oci-bv
        resources:
          requests:
            storage: 20Gi
