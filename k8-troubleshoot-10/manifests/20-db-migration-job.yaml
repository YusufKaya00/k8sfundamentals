apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrator
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: db-migrator
    app.kubernetes.io/part-of: pulsestream
spec:
  activeDeadlineSeconds: 4
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrator
        app.kubernetes.io/part-of: pulsestream
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        tier: web
      containers:
        - name: db-migrator
          image: docker.io/library/postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              echo "Connecting to database migration target..."
              PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-db -U pulse_admin -d pulse_analytics -c "CREATE TABLE IF NOT EXISTS events (id INT, event_type VARCHAR(50), payload TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
              echo "Running analytics indexing simulation..."
              sleep 8
              echo "Migration complete."
          env:
            - name: POSTGRES_PASSWORD
              value: PulseSecretPassword123!
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
