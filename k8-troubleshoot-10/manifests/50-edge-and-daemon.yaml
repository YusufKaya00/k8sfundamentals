apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: log-agent
    app.kubernetes.io/part-of: pulsestream
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: log-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-agent
        app.kubernetes.io/part-of: pulsestream
    spec:
      containers:
        - name: log-agent
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "while true; do echo \"[$(date)] log-agent collecting node telemetry\"; sleep 10; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-gateway-config
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: pulse-gateway
    app.kubernetes.io/part-of: pulsestream
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        server {
            listen 8080;
            server_name _;

            location /api/reports {
                proxy_pass http://report-api/reports;
                proxy_connect_timeout 3s;
                proxy_read_timeout 5s;
            }

            location /healthz {
                default_type text/plain;
                return 200 'OK';
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-gateway
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: pulse-gateway
    app.kubernetes.io/part-of: pulsestream
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-gateway
        app.kubernetes.io/part-of: pulsestream
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: pulse-gateway
          image: docker.io/library/nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: pulse-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-gateway
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: pulse-gateway
    app.kubernetes.io/part-of: pulsestream
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: pulse-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
