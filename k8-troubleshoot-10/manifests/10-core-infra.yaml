apiVersion: v1
kind: Service
metadata:
  name: pulse-db
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: pulse-db
    app.kubernetes.io/part-of: pulsestream
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulse-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulse-db
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: pulse-db
    app.kubernetes.io/part-of: pulsestream
spec:
  serviceName: pulse-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-db
        app.kubernetes.io/part-of: pulsestream
        tier: database
    spec:
      nodeSelector:
        tier: database
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: pulse_analytics
            - name: POSTGRES_USER
              value: pulse_admin
            - name: POSTGRES_PASSWORD
              value: PulseSecretPassword123!
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U pulse_admin -d pulse_analytics
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: oci-bv
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-redis
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: pulse-redis
    app.kubernetes.io/part-of: pulsestream
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-redis
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: pulse-redis
    app.kubernetes.io/part-of: pulsestream
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-redis
        app.kubernetes.io/part-of: pulsestream
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: redis
          image: docker.io/library/redis:7.2-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
