replicaCount: 3

nodeSelector:
  tier: web

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - order-api
          topologyKey: "kubernetes.io/hostname"

extraEnv: []