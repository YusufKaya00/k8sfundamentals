apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-lb.fullname" . }}
  labels:
    {{- include "edge-lb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "edge-lb.selectorLabels" . | nindent 4 }}
