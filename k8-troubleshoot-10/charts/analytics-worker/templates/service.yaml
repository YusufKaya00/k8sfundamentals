apiVersion: v1
kind: Service
metadata:
  name: {{ include "analytics-worker.fullname" . }}
  labels:
    {{- include "analytics-worker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 9100 }}
      targetPort: {{ .Values.service.targetPort | default 9100 }}
      protocol: TCP
      name: metrics
  selector:
    {{- include "analytics-worker.selectorLabels" . | nindent 4 }}
