# ==============================================================================
# Katman 3: Frontend Web, NetworkPolicy ve HPA (Oto-Ölçekleme)
# ==============================================================================

# BİLET #1 HATASI: Minikube / lokal ortamda bulunmayan 'eu-west-1a' bölge etiketi! Pod 'Pending' kalır.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: ecom-prod
  labels:
    app: frontend-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      # HATA: Lokal minikube kümesinde AWS zone etiketi bulunmaz!
      nodeSelector:
        topology.kubernetes.io/zone: eu-west-1a
      containers:
        - name: web
          image: docker.io/library/nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ecom-prod
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: frontend-web
---
# BİLET #7 HATASI: Egress politikasında CoreDNS (Port 53 UDP) unutulmuş! Dahili DNS zaman aşımına uğrar.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecom-network-policy
  namespace: ecom-prod
spec:
  podSelector:
    matchLabels:
      app: catalog-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend-web
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-db
      ports:
        - protocol: TCP
          port: 5432
    # HATA: CoreDNS (UDP 53) çıkışı engellendi! DNS çözümü 30 saniye sonra time out verir.
---
# BİLET #8: catalog-api podunda 'requests.cpu' olmadığı için bu HPA '<unknown>/50%' kalır!
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-hpa
  namespace: ecom-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
