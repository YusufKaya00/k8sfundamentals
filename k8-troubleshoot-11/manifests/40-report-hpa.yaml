apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-api-hpa
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: report-api-hpa
    app.kubernetes.io/part-of: pulsestream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reporting-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
