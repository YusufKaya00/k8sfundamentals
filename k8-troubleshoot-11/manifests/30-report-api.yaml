apiVersion: v1
kind: ConfigMap
metadata:
  name: report-api-config
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: report-api
    app.kubernetes.io/part-of: pulsestream
data:
  server.py: |
    import http.server
    import json
    import time

    class ReportAPIHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/healthz':
                time.sleep(2.5)
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write(b'OK\n')
            elif self.path == '/ready':
                time.sleep(2.5)
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write(b'READY\n')
            elif self.path == '/reports':
                payload = {
                    "platform": "PulseStream",
                    "status": "active",
                    "realtime_metrics": {
                        "throughput_rps": 1250,
                        "p99_latency_ms": 14.2
                    }
                }
                body = json.dumps(payload).encode('utf-8')
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            print(f"[{self.log_date_time_string()}] {format % args}", flush=True)

    if __name__ == '__main__':
        server = http.server.ThreadingHTTPServer(('0.0.0.0', 8000), ReportAPIHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: report-api
    app.kubernetes.io/part-of: pulsestream
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: report-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-api
        app.kubernetes.io/part-of: pulsestream
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: report-api
          image: docker.io/library/python:3.12-slim
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /app
      volumes:
        - name: config
          configMap:
            name: report-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: report-api
  namespace: pulsestream-prod
  labels:
    app.kubernetes.io/name: report-api
    app.kubernetes.io/part-of: pulsestream
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: report-api
  ports:
    - name: http
      port: 80
      targetPort: api-http
      protocol: TCP
