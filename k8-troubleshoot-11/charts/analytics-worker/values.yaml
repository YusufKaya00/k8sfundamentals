replicaCount: 1

image:
  repository: docker.io/library/python
  tag: 3.12-slim
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

nodeSelector:
  tier: web

backend:
  redis:
    host: "0.0.0.0"
    port: 6379

service:
  type: ClusterIP
  port: 9100
  targetPort: 9100

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
