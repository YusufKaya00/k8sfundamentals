apiVersion: v1
kind: Secret
metadata:
  name: ledger-db-secret
  namespace: paystream-prod
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: paystream
type: Opaque
stringData:
  POSTGRES_DB: paystream
  POSTGRES_USER: ledger_admin
  POSTGRES_PASSWORD: PayStreamSecure2026!
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: paystream-prod
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: paystream
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ledger-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-db
  namespace: paystream-prod
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: paystream
spec:
  serviceName: ledger-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-db
        app.kubernetes.io/part-of: paystream
        tier: database
    spec:
      nodeSelector:
        tier: database
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ledger-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: oci-bv
        resources:
          requests:
            storage: 20Gi
