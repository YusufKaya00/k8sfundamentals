apiVersion: v1
kind: Service
metadata:
  name: payment-service-stable
  namespace: production
  labels:
    app: payment-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: payment-service
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-canary
  namespace: production
  labels:
    app: payment-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: payment-service