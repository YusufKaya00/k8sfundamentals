name: Validate Kubernetes YAML

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          import sys

          failed = False

          for path in pathlib.Path(".").rglob("*"):
              if "k8-training" in path.parts:
                  continue

              if path.suffix not in (".yaml", ".yml"):
                  continue

              try:
                  with path.open() as f:
                      list(yaml.safe_load_all(f))
                  print(f"OK: {path}")
              except Exception as e:
                  print(f"ERROR: {path}")
                  print(e)
                  failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            /work/k8-project-1