apiVersion: v1
kind: Service
metadata:
  name: dispatch-gateway
  namespace: nexus-prod
  labels:
    app.kubernetes.io/name: dispatch-gateway
    app.kubernetes.io/part-of: nexus-logistics
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "40"
spec:
  type: LoadBalancer
  # BUG INC-706: Selector label drift. Pods have app.kubernetes.io/name: dispatch-gateway
  selector:
    app.kubernetes.io/name: dispatch-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-gateway
  namespace: nexus-prod
  labels:
    app.kubernetes.io/name: dispatch-gateway
    app.kubernetes.io/part-of: nexus-logistics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch-gateway
        app.kubernetes.io/part-of: nexus-logistics
    spec:
      containers:
      - name: gateway
        image: docker.io/library/nginx:1.25-alpine
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: nginx-conf
        configMap:
          name: gateway-config
