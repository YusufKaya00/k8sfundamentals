apiVersion: v1
kind: Service
metadata:
  name: routing-engine
  namespace: nexus-prod
  labels:
    app.kubernetes.io/name: routing-engine
    app.kubernetes.io/part-of: nexus-logistics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: routing-engine
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-engine
  namespace: nexus-prod
  labels:
    app.kubernetes.io/name: routing-engine
    app.kubernetes.io/part-of: nexus-logistics
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: routing-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routing-engine
        app.kubernetes.io/part-of: nexus-logistics
    spec:
      affinity:
        podAntiAffinity:
          # BUG INC-708: Strict anti-affinity requires 3 distinct nodes.
          # The cluster only has 2 web tier nodes (Node-3 has database taint).
          # Replica 3 gets permanently stuck in Pending.
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - routing-engine
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: routing-api
        image: docker.io/library/python:3.11-alpine
        command:
        - python3
        - -c
        - |
          import http.server, json, socketserver

          class RoutingHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/healthz":
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(b'{"status":"healthy","service":"routing-engine"}\n')
                  elif self.path.startswith("/api/v1/routes"):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(b'{"grid":"nexus","routes":[{"id":"NEX-101","origin":"FRA-CENTRAL","dest":"BER-DEPOT","status":"OPTIMAL"},{"id":"NEX-102","origin":"MUC-LOGISTICS","dest":"HAM-PORT","status":"DISPATCHED"}]}\n')
                  else:
                      self.send_response(404)
                      self.end_headers()
                      self.wfile.write(b'{"error":"not_found"}\n')

              def log_message(self, format, *args):
                  pass

          server = socketserver.TCPServer(("0.0.0.0", 8080), RoutingHandler)
          print("[ROUTING-ENGINE] Listening on port 8080...")
          server.serve_forever()
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
