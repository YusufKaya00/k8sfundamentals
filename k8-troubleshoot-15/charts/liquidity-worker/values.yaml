replicaCount: 1

image:
  repository: docker.io/library/python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

initImage:
  repository: docker.io/library/busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9095
  targetPort: 9095

redis:
  host: "quant-redis"
  port: 6379

livenessProbe:
  path: "/healthz"
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: "/ready"
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi
