apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-api-config
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/part-of: aero-ops
data:
  DB_HOST: "radar-db"
  DB_PORT: "5433" # BUG: INC-605: Typo for 5432!
  DB_NAME: "aero_telemetry"
  DB_USER: "aero_admin"
  REDIS_HOST: "track-cache"
  REDIS_PORT: "6379"
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import os, socket, json, sys

    DB_HOST = os.environ.get("DB_HOST", "radar-db")
    DB_PORT = int(os.environ.get("DB_PORT", "5433"))
    REDIS_HOST = os.environ.get("REDIS_HOST", "track-cache")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))

    def check_tcp(host, port, timeout=2.0):
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(timeout)
            s.connect((host, port))
            s.close()
            return True, "connected"
        except Exception as e:
            return False, str(e)

    class TelemetryHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"status": "alive", "service": "telemetry-api"}).encode('utf-8'))
                return

            if self.path == "/ready":
                db_ok, db_msg = check_tcp(DB_HOST, DB_PORT)
                cache_ok, cache_msg = check_tcp(REDIS_HOST, REDIS_PORT)

                is_ready = db_ok and cache_ok
                status_code = 200 if is_ready else 503

                resp = {
                    "ready": is_ready,
                    "database": {"host": DB_HOST, "port": DB_PORT, "status": db_msg},
                    "cache": {"host": REDIS_HOST, "port": REDIS_PORT, "status": cache_msg}
                }

                self.send_response(status_code)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps(resp, indent=2).encode('utf-8'))
                return

            if self.path.startswith("/api/radar"):
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                payload = {
                    "sector": "EU-ATC-SECTOR-4",
                    "airspace": "Frankfurt Terminal Area",
                    "transponders_tracked": 142,
                    "active_flights": [
                        {"callsign": "DLH402", "altitude_ft": 36000, "squawk": "7721", "speed_kts": 480},
                        {"callsign": "THY1984", "altitude_ft": 32000, "squawk": "4412", "speed_kts": 455},
                        {"callsign": "AFR112", "altitude_ft": 28000, "squawk": "1200", "speed_kts": 410}
                    ]
                }
                self.wfile.write(json.dumps(payload, indent=2).encode('utf-8'))
                return

            self.send_response(404)
            self.end_headers()

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format%args))
            sys.stdout.flush()

    server = HTTPServer(('0.0.0.0', 8080), TelemetryHandler)
    print("Telemetry API listening on 0.0.0.0:8080...", flush=True)
    server.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-conf
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: flight-gateway
    app.kubernetes.io/part-of: aero-ops
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        server {
            listen 8080;
            server_name _;

            location /health {
                default_type application/json;
                return 200 '{"status": "healthy", "service": "flight-gateway"}\n';
            }

            location /api/radar {
                # BUG: INC-607: telemetry-api exposes port 8080, but nginx proxies to port 80!
                proxy_pass http://telemetry-api:80;
                proxy_connect_timeout 2s;
                proxy_read_timeout 3s;
            }

            location / {
                default_type application/json;
                return 200 '{"platform": "AeroOps Air Traffic Dispatch Gateway", "version": "v4.1"}\n';
            }
        }
    }
