apiVersion: v1
kind: Service
metadata:
  name: radar-db-headless
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: radar-db
    app.kubernetes.io/part-of: aero-ops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: radar-db
    tier: backend
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: radar-db
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: radar-db
    app.kubernetes.io/part-of: aero-ops
spec:
  serviceName: "radar-db"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-db
        app.kubernetes.io/part-of: aero-ops
        tier: database
    spec:
      nodeSelector:
        tier: database
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "db"
        effect: "NoSchedule"
      containers:
      - name: postgres
        image: docker.io/library/postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: aero_telemetry
        - name: POSTGRES_USER
          value: aero_admin
        - name: POSTGRES_PASSWORD
          value: AeroSecureRadar2026!
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgresql
          containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 384Mi
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        emptyDir: {}
