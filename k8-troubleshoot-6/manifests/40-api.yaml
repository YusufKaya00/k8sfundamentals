apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/part-of: aero-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/version: v2
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/part-of: aero-ops

spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-api
      app.kubernetes.io/version: v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-api
        app.kubernetes.io/part-of: aero-ops
        app.kubernetes.io/version: v2
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
      - name: api
        image: docker.io/library/python:3.11-alpine
        command: ["python", "/app/server.py"]
        envFrom:
        - configMapRef:
            name: telemetry-api-config
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: telemetry-api-config
