apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intel-api-netpol
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: intel-api
    app.kubernetes.io/part-of: aegisgrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intel-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-gateway
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-shield
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: node-shield
    app.kubernetes.io/part-of: aegisgrid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-shield
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-shield
        app.kubernetes.io/part-of: aegisgrid
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: shield-agent
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "echo 'Node shield agent monitoring kernel events...'; while true; do sleep 30; done"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
