apiVersion: v1
kind: Secret
metadata:
  name: aegis-db-secret
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: aegis-db
    app.kubernetes.io/part-of: aegisgrid
type: Opaque
stringData:
  database-password: "AegisSuperSecret2026!"
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-db
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: aegis-db
    app.kubernetes.io/part-of: aegisgrid
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: aegis-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegis-db
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: aegis-db
    app.kubernetes.io/part-of: aegisgrid
spec:
  serviceName: aegis-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-db
        app.kubernetes.io/part-of: aegisgrid
    spec:
      nodeSelector:
        tier: database
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "aegis_intel"
            - name: POSTGRES_USER
              value: "aegis_admin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-db-secret
                  key: database-password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U aegis_admin -d aegis_intel
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U aegis_admin -d aegis_intel
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: oci-bv
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-redis
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: aegis-redis
    app.kubernetes.io/part-of: aegisgrid
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    - app.kubernetes.io/name: aegis-redis
    - app.kubernetes.io/part-of: aegisgrid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-redis
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: aegis-redis
    app.kubernetes.io/part-of: aegisgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-redis
        app.kubernetes.io/part-of: aegisgrid
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: redis
          image: docker.io/library/redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
