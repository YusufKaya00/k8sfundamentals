replicaCount: 1

image:
  repository: docker.io/library/python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

initImage:
  repository: docker.io/library/busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

nodeSelector:
  tier: web

db:
  host: "aegis-db"
  port: 5432

service:
  type: ClusterIP
  port: 9090
  targetPort: 9090

startupProbe:
  periodSeconds: 2
  failureThreshold: 12
  timeoutSeconds: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
