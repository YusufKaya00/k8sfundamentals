apiVersion: v1
kind: ConfigMap
metadata:
  name: scanner-worker-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: scanner-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aegisgrid
data:
  scanner.py: |
    import json
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    print("Initializing scanner engine, loading signatures (6s warmup)...", flush=True)
    time.sleep(6)
    print("Scanner engine ready on port 9090", flush=True)

    class ScannerHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ("/healthz", "/scan"):
                payload = json.dumps({
                    "status": "healthy",
                    "engine": "scanner-worker",
                    "signatures_loaded": 3
                }).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(payload)))
                self.end_headers()
                self.wfile.write(payload)
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            return

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", 9090), ScannerHandler)
        server.serve_forever()
