apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-api-hpa
  namespace: omnicore-prod
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: omnicore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-engine
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: omnicore-prod
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: omnicore
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: checkout-api
    tier: checkout-core
