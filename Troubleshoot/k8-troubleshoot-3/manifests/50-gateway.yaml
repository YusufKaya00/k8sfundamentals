apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: apex-prod
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: apexpay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: apexpay
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: gateway
          image: docker.io/library/nginx:1.25-alpine
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: gateway-nginx
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-html
          configMap:
            name: gateway-nginx
            items:
              - key: index.html
                path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: apex-prod
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: apexpay
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: gateway
