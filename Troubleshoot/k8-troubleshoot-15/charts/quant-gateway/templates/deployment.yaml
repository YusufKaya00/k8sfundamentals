apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: quant-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: quantflow
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: quant-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quant-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: quantflow
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: quant-gateway-config
