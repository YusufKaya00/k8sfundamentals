replicaCount: 1

redis:
  host: "quant-redis"
  port: 6379

livenessProbe:
  path: "/healthz"
  initialDelaySeconds: 5
  periodSeconds: 4
  timeoutSeconds: 2
  failureThreshold: 2

readinessProbe:
  path: "/healthz"
  initialDelaySeconds: 3
  periodSeconds: 4
  timeoutSeconds: 2
  failureThreshold: 2

resources:
  requests:
    cpu: 50m
    memory: 50Mi
  limits:
    cpu: 250m
    memory: 256Mi
