namespace: omnipulse-prod

webapp:
  replicas: 2
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.27-alpine"
  containerPort: 8080
  servicePort: 80
  probePath: /ready
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

cache:
  image:
    repository: redis
    tag: "7.2-alpine"
  port: 6379
  storageClassName: "managed-csi"
  storageSize: 2Gi
  passwordPlain: "OmniPulse#2026!"

sharedStorage:
  storageClassName: "azurefile-csi"
  accessMode: "ReadWriteMany"
  size: 2Gi

cronjob:
  schedule: "*/1 * * * *"
  suspend: true

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  minAvailable: 3

ingress:
  className: nginx
