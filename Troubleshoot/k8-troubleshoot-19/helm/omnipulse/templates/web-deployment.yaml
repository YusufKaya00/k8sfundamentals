apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.webapp.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
      tier: frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ .Release.Name }}-web
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: verify-cluster-state
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ .Release.Name }}-cache-0.${REDIS_HOST} -p ${REDIS_PORT} GET omnipulse:schema:status | grep -q INITIALIZED_V3 && test -f /usr/share/nginx/html/index.html; do
                echo "Waiting for cache schema initialization and shared RWX index.html..."
                sleep 2
              done
          volumeMounts:
            - name: shared-html
              mountPath: /usr/share/nginx/html
      containers:
        - name: web
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}"
          ports:
            - containerPort: {{ .Values.webapp.containerPort }}
          resources:
            {{- toYaml .Values.webapp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.webapp.probePath }}
              port: {{ .Values.webapp.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.webapp.probePath }}
              port: {{ .Values.webapp.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: shared-html
              mountPath: /usr/share/nginx/html
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: shared-html
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-shared-html
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-nginx-conf
