apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.cache.passwordPlain | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  REDIS_HOST: "{{ .Release.Name }}-cache"
  REDIS_PORT: "{{ .Values.cache.port }}"
  APP_VERSION: "v3.0.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-conf
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
        listen       8080;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location = /ready {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
