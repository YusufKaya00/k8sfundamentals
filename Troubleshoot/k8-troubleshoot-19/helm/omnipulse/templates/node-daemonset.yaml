apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-node-agent
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-node-agent
      tier: monitoring
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-node-agent
        tier: monitoring
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/telemetry: "enabled"
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                date -u +"%Y-%m-%dT%H:%M:%SZ NODE_AGENT_HEALTHY" >> /var/spool/omnipulse/node-health.log
                sleep 15
              done
          volumeMounts:
            - name: agent-spool
              mountPath: /var/spool/omnipulse
              readOnly: true
      volumes:
        - name: agent-spool
          emptyDir: {}
