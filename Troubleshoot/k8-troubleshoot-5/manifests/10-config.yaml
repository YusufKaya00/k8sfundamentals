apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-conf
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: merchant-gateway
    app.kubernetes.io/part-of: apex-pay
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        server {
            listen 8080;
            server_name _;

            location /health {
                default_type application/json;
                return 200 '{"gateway": "healthy", "service": "merchant-gateway", "tier": "web"}\n';
            }

            location /api/payment/ {
                proxy_pass http://payment-processor-svc:80/;
                proxy_connect_timeout 3s;
                proxy_read_timeout 5s;
            }

            location /api/fraud/ {
                proxy_pass http://fraud-engine-svc:8080/;
                proxy_connect_timeout 3s;
                proxy_read_timeout 5s;
            }

            location / {
                default_type application/json;
                return 200 '{"status": "online", "system": "ApexPay Settlement Gateway v3.2"}\n';
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-script-conf
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: fraud-engine
    app.kubernetes.io/part-of: apex-pay
data:
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json, sys

    class FraudHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            resp = {
                "status": "active",
                "service": "fraud-engine",
                "risk_model": "xgboost-fraud-v3",
                "decision": "APPROVED"
            }
            self.wfile.write(json.dumps(resp).encode('utf-8'))

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format%args))
            sys.stdout.flush()

    server = HTTPServer(('0.0.0.0', 8080), FraudHandler)
    print("Fraud Engine listening on 0.0.0.0:8080...", flush=True)
    server.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-script-conf
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: payment-processor
    app.kubernetes.io/part-of: apex-pay
data:
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json, sys

    class PaymentHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            resp = {
                "status": "ready",
                "service": "payment-processor",
                "ledger_sync": "connected",
                "port_listening": 8080
            }
            self.wfile.write(json.dumps(resp).encode('utf-8'))

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format%args))
            sys.stdout.flush()

    server = HTTPServer(('0.0.0.0', 8080), PaymentHandler)
    print("Payment Processor listening on 0.0.0.0:8080...", flush=True)
    server.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: broker-script-conf
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: notification-broker
    app.kubernetes.io/part-of: apex-pay
data:
  server.py: |
    import socket, threading, sys
    from http.server import HTTPServer, BaseHTTPRequestHandler

    # 1. Metrics HTTP server on 9090
    class MetricHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.send_header('Content-Type', 'text/plain')
            self.end_headers()
            self.wfile.write(b"# HELP broker_events_total Total events\nbroker_events_total 1024\n")
        def log_message(self, format, *args):
            pass

    def run_metrics():
        httpd = HTTPServer(('0.0.0.0', 9090), MetricHandler)
        print("Metrics server listening on 0.0.0.0:9090 (TCP)", flush=True)
        httpd.serve_forever()

    # 2. Notification TCP Server on 9000
    def run_tcp_events():
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind(('0.0.0.0', 9000))
        s.listen(10)
        print("Notification Event Broker listening on 0.0.0.0:9000 (TCP)", flush=True)
        while True:
            conn, addr = s.accept()
            try:
                conn.sendall(b"APEX_BROKER_ACK:CONNECTED\n")
            finally:
                conn.close()

    t1 = threading.Thread(target=run_metrics, daemon=True)
    t1.start()
    run_tcp_events()
