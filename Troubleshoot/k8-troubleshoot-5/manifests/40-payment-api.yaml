apiVersion: v1
kind: Service
metadata:
  name: payment-processor-svc
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: payment-processor
    app.kubernetes.io/part-of: apex-pay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-processor
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: payment-processor
    app.kubernetes.io/part-of: apex-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-processor
        app.kubernetes.io/part-of: apex-pay
    spec:
      nodeSelector:
        tier: web
      containers:
      - name: processor
        image: docker.io/library/python:3.11-alpine
        command: ["python", "/app/server.py"]
        ports:
        - name: http-api
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: script-vol
          mountPath: /app
      volumes:
      - name: script-vol
        configMap:
          name: payment-script-conf
