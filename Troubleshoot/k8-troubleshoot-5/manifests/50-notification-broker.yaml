apiVersion: v1
kind: Service
metadata:
  name: notification-broker-svc
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: notification-broker
    app.kubernetes.io/part-of: apex-pay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-broker
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: events
    port: 9000
    targetPort: 9000
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-broker
  namespace: apex-pay
  labels:
    app.kubernetes.io/name: notification-broker
    app.kubernetes.io/part-of: apex-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-broker
        app.kubernetes.io/part-of: apex-pay
    spec:
      nodeSelector:
        tier: web
      containers:
      - name: broker
        image: docker.io/library/python:3.11-alpine
        command: ["python", "/app/server.py"]
        ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: events
          containerPort: 9000
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: script-vol
          mountPath: /app
      volumes:
      - name: script-vol
        configMap:
          name: broker-script-conf
