apiVersion: v1
kind: Service
metadata:
  name: intel-api
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: intel-api
    app.kubernetes.io/part-of: aegisgrid
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: intel-api
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-shield
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: node-shield
    app.kubernetes.io/part-of: aegisgrid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-shield
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-shield
        app.kubernetes.io/part-of: aegisgrid
    spec:
      terminationGracePeriodSeconds: 1
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoExecute
      containers:
        - name: shield-agent
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "echo 'Node shield agent monitoring kernel events...'; while true; do sleep 30; done"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
