apiVersion: v1
kind: ConfigMap
metadata:
  name: intel-api-config
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: intel-api
    app.kubernetes.io/part-of: aegisgrid
data:
  PORT: "8000"
  DB_HOST: "aegis-db"
  DB_PORT: "5432"
  REDIS_HOST: "aegis-redis"
  REDIS_PORT: "6379"
  SCANNER_HOST: "scanner-worker"
  SCANNER_PORT: "9090"
  REQUIRED_GATEWAY_TOKEN: "aegis-verified"
  server.py: |
    import json
    import os
    import socket
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PORT = int(os.environ.get("PORT", "8000"))
    DB_HOST = os.environ.get("DB_HOST", "aegis-db")
    DB_PORT = int(os.environ.get("DB_PORT", "5432"))
    REDIS_HOST = os.environ.get("REDIS_HOST", "aegis-redis")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))
    SCANNER_HOST = os.environ.get("SCANNER_HOST", "scanner-worker")
    SCANNER_PORT = int(os.environ.get("SCANNER_PORT", "9090"))
    REQUIRED_GATEWAY_TOKEN = os.environ.get("REQUIRED_GATEWAY_TOKEN", "aegis-verified")

    class IntelApiHandler(BaseHTTPRequestHandler):
        def _send_json(self, status_code, data):
            payload = json.dumps(data).encode("utf-8")
            self.send_response(status_code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                self._send_json(200, {"status": "alive", "service": "intel-api"})
                return

            if self.path == "/ready":
                try:
                    with socket.create_connection((DB_HOST, DB_PORT), timeout=2):
                        pass
                    with socket.create_connection((REDIS_HOST, REDIS_PORT), timeout=2):
                        pass
                    scanner_url = f"http://{SCANNER_HOST}:{SCANNER_PORT}/healthz"
                    with urllib.request.urlopen(scanner_url, timeout=2) as resp:
                        if resp.status != 200:
                            raise RuntimeError(f"scanner returned HTTP {resp.status}")
                    self._send_json(200, {
                        "status": "ready",
                        "db": "connected",
                        "redis": "connected",
                        "scanner": "connected"
                    })
                except Exception as e:
                    self._send_json(503, {
                        "status": "not_ready",
                        "error": str(e)
                    })
                return

            if self.path == "/api/v1/threats":
                token = self.headers.get("X-Aegis-Token")
                if token != REQUIRED_GATEWAY_TOKEN:
                    self._send_json(403, {
                        "error": "untrusted proxy: invalid or missing X-Aegis-Token header"
                    })
                    return
                self._send_json(200, {
                    "platform": "AegisGrid",
                    "status": "operational",
                    "active_signatures": ["SQLI-9001", "XSS-9002", "RCE-9003"],
                    "scanner_engine": "online"
                })
                return

            self._send_json(404, {"error": "route not found"})

        def log_message(self, format, *args):
            print(f"[intel-api] {self.address_string()} - {format % args}", flush=True)

    if __name__ == "__main__":
        print(f"Starting intel-api on 0.0.0.0:{PORT}...", flush=True)
        server = HTTPServer(("0.0.0.0", PORT), IntelApiHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-api
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: intel-api
    app.kubernetes.io/part-of: aegisgrid
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-api
        app.kubernetes.io/part-of: aegisgrid
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: intel-api
          image: docker.io/library/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /app/server.py
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: intel-api-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: intel-api-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: intel-api-pdb
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: intel-api
    app.kubernetes.io/part-of: aegisgrid
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-api
