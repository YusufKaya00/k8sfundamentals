apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nova-prod
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: novamarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: novamarket
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: redis
          image: docker.io/library/redis:7.2-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nova-prod
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: novamarket
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: redis
    #app.kubernetes.io/component: cache
