apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: nova-prod
  labels:
    app.kubernetes.io/part-of: novamarket
type: Opaque
stringData:
  POSTGRES_DB: "novadb"
  POSTGRES_USER: "novauser"
  POSTGRES_PASSWORD: "NovaSecurePass2026!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: nova-prod
  labels:
    app.kubernetes.io/part-of: novamarket
data:
  DB_HOST: "postgres.nova-prod.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "novadb"
  DB_USER: "novauser"
  REDIS_HOST: "redis.nova-prod.svc.cluster.local"
  REDIS_PORT: "6379"
  PORT: "8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-app
  namespace: nova-prod
  labels:
    app.kubernetes.io/part-of: novamarket
data:
  server.py: |
    import http.server
    import socketserver
    import os
    import sys
    import time
    import json
    import socket

    print("[API] Starting NovaMarket API service...", flush=True)
    print("[API] Initializing application dependencies and warm-up routine (10s)...", flush=True)
    time.sleep(10)

    db_host = os.environ.get("DB_HOST")
    db_port = os.environ.get("DB_PORT", "5432")
    redis_host = os.environ.get("REDIS_HOST", "redis")
    redis_port = os.environ.get("REDIS_PORT", "6379")
    port = int(os.environ.get("PORT", "8080"))

    if not db_host or len(db_host.strip()) == 0:
        sys.stderr.write("[FATAL] DB_HOST environment variable is missing or empty. Application cannot proceed.\n")
        sys.stderr.flush()
        sys.exit(1)

    print(f"[API] Configuration verified. Target DB: {db_host}:{db_port}, Redis: {redis_host}:{redis_port}", flush=True)

    def probe_tcp(host, port_num, timeout=1.5):
        try:
            s = socket.create_connection((host, int(port_num)), timeout=timeout)
            s.close()
            return True
        except Exception as e:
            return False

    class RequestHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            sys.stdout.write(f"[{self.log_date_time_string()}] {self.address_string()} - {format%args}\n")
            sys.stdout.flush()

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ok", "component": "api"}).encode("utf-8"))
            elif self.path == "/ready":
                db_ok = probe_tcp(db_host, db_port)
                redis_ok = probe_tcp(redis_host, redis_port)
                if db_ok and redis_ok:
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    resp = {
                        "status": "ready",
                        "database": "connected",
                        "redis": "connected"
                    }
                    self.wfile.write(json.dumps(resp).encode("utf-8"))
                else:
                    self.send_response(503)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    resp = {
                        "status": "not_ready",
                        "database": "connected" if db_ok else "unreachable",
                        "redis": "connected" if redis_ok else "unreachable"
                    }
                    self.wfile.write(json.dumps(resp).encode("utf-8"))
            elif self.path in ["/api/products", "/products", "/"]:
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                data = [
                    {"id": 101, "name": "Production Kubernetes Guide", "price": 49.99, "stock": 140},
                    {"id": 102, "name": "SRE Incident Mitigation Handbook", "price": 39.99, "stock": 85},
                    {"id": 103, "name": "Cloud Native Architecture Blueprint", "price": 59.99, "stock": 30}
                ]
                self.wfile.write(json.dumps(data).encode("utf-8"))
            else:
                self.send_response(404)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"error": "not_found"}).encode("utf-8"))

    print(f"[API] Listening for connections on port {port}...", flush=True)
    with socketserver.TCPServer(("", port), RequestHandler) as httpd:
        httpd.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: nova-prod
  labels:
    app.kubernetes.io/part-of: novamarket
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","component":"frontend"}\n';
        }

        location /api/ {
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>NovaMarket Storefront</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
            .card { background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; max-width: 600px; margin: auto; }
            h1 { color: #38bdf8; font-size: 24px; }
            .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #0284c7; color: white; font-size: 12px; }
        </style>
    </head>
    <body>
        <div class="card">
            <span class="badge">Production</span>
            <h1>NovaMarket E-Commerce Platform</h1>
            <p>Welcome to NovaMarket. Microservices frontend online.</p>
        </div>
    </body>
    </html>
