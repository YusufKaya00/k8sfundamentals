apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cache-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.cache.passwordPlain | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  namespace: {{ .Values.namespace }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>NovaStore v2.4 - Live</title>
      <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding-top: 10%; }
        .badge { background: #22c55e; color: #052e16; padding: 6px 14px; border-radius: 999px; font-weight: bold; }
      </style>
    </head>
    <body>
      <h1>NovaStore Production Gateway</h1>
      <p><span class="badge">STATUS: ONLINE (v2.4.0)</span></p>
      <p>Connected to Session Cache Cluster: <strong>{{ .Release.Name }}-cache:6379</strong></p>
    </body>
    </html>
  default.conf: |
    server {
        listen       8080;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location = /ready {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
