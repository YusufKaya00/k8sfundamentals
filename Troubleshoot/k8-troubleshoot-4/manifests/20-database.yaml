apiVersion: v1
kind: Service
metadata:
  name: vitals-db
  namespace: pulse-prod
  labels:
    app.kubernetes.io/name: vitals-db
    app.kubernetes.io/part-of: pulsemed
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app.kubernetes.io/name: vitals-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vitals-db
  namespace: pulse-prod
  labels:
    app.kubernetes.io/name: vitals-db
    app.kubernetes.io/part-of: pulsemed
spec:
  serviceName: "vitals-db"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vitals-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitals-db
        app.kubernetes.io/part-of: pulsemed
    spec:
      nodeSelector:
        tier: database
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "database"
          effect: "NoSchedule"
      containers:
        - name: postgresql
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vitals-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vitals-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vitals-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: vitals-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: vitals-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "oci-bv"
        resources:
          requests:
            storage: 50Gi
