apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-worker-config
  namespace: chronos-prod
  labels:
    app.kubernetes.io/name: inventory-worker
    app.kubernetes.io/part-of: chronos
data:
  worker.py: |
    import http.server
    import json
    import os
    import sys

    print("Starting inventory-worker service...", flush=True)
    print("Loading in-memory inventory stock catalog...", flush=True)

    stock_cache = bytearray(80 * 1024 * 1024)

    print("Inventory stock catalog loaded successfully (80MB allocated).", flush=True)

    class InventoryHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ['/healthz', '/stock']:
                payload = {
                    "status": "healthy",
                    "service": "inventory-worker",
                    "stock_items_loaded": len(stock_cache) // 1024
                }
                body = json.dumps(payload).encode('utf-8')
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format % args))
            sys.stdout.flush()

    if __name__ == '__main__':
        PORT = 9000
        server = http.server.HTTPServer(('0.0.0.0', PORT), InventoryHandler)
        print(f"Inventory worker listening on port {PORT}...", flush=True)
        server.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-worker
  namespace: chronos-prod
  labels:
    app.kubernetes.io/name: inventory-worker
    app.kubernetes.io/part-of: chronos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-worker
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-worker
  namespace: chronos-prod
  labels:
    app.kubernetes.io/name: inventory-worker
    app.kubernetes.io/part-of: chronos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-worker
        app.kubernetes.io/part-of: chronos
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: worker
          image: docker.io/library/python:3.12-slim
          command:
            - python
            - -u
            - /app/worker.py
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 40Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: inventory-worker-config
