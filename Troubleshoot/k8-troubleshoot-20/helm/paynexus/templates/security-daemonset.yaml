apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-security-agent
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-security-agent
      tier: security
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-security-agent
        tier: security
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        # Hata 9: AKS düğümlerinde bu özel etiket bulunmadığı için DaemonSet DESIRED: 0 kalır.
        security.azure.com/agent-v4: "enabled"
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                date -u +"%Y-%m-%dT%H:%M:%SZ SECURITY_AGENT_HEARTBEAT" >> /var/log/paynexus-security.log
                sleep 15
              done
          volumeMounts:
            - name: log-spool
              mountPath: /var/log
              # Hata 9b: Salt okunur bağlandığı için dosya yazma hatası verir.
              readOnly: true
      volumes:
        - name: log-spool
          emptyDir: {}
