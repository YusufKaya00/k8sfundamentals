apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.db.passwordPlain | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: "{{ .Release.Name }}-db"
  DB_PORT: "{{ .Values.db.port }}"
  DB_USER: "{{ .Values.db.user }}"
  DB_NAME: "{{ .Values.db.database }}"
  APP_VERSION: "v4.2.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-conf
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
        listen       8080;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location = /ready {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
