apiVersion: v1
kind: Service
metadata:
  name: settlement-api
  namespace: aether-prod
  labels:
    app.kubernetes.io/name: settlement-api
    app.kubernetes.io/part-of: aethermesh
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: settlement-api
    role: core-engine
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: settlement-api-hpa
  namespace: aether-prod
  labels:
    app.kubernetes.io/name: settlement-api
    app.kubernetes.io/part-of: aethermesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: settlement-service
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
