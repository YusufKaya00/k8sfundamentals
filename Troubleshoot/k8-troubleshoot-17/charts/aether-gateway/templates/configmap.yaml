apiVersion: v1
kind: ConfigMap
metadata:
  name: aether-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aether-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aethermesh
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/json;
        access_log /dev/stdout;
        sendfile on;
        keepalive_timeout 65;

        server {
            listen 8080;
            server_name _;

            location = /healthz {
                access_log off;
                add_header Content-Type application/json;
                return 200 '{"status":"ok","gateway":"aether-gateway"}\n';
            }

            location /api/v1/settlements {
                proxy_http_version 1.1;
                proxy_connect_timeout 3s;
                proxy_read_timeout 5s;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Aether-Token "{{ .Values.gateway.authToken }}";
                proxy_pass http://{{ .Values.upstream.host }}:{{ .Values.upstream.port }}/api/v1/settlements;
            }
        }
    }
