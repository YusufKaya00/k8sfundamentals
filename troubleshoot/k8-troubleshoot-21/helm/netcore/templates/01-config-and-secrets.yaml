apiVersion: v1
kind: Secret
metadata:
  name: netcore-vault-token
  namespace: {{ .Values.global.primaryNamespace }}
type: Opaque
stringData:
  token: {{ .Values.vault.token | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netcore-gateway-conf
  namespace: {{ .Values.global.primaryNamespace }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /network/status {
            proxy_pass http://netcore-api:8000/network/status;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }

        location /auth/verify {
            proxy_pass http://auth-vault:8443/vault/verify;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netcore-api-conf
  namespace: {{ .Values.global.primaryNamespace }}
data:
  BIND_HOST: {{ .Values.api.bindHost | quote }}
  PORT: {{ .Values.api.port | quote }}
  CACHE_HOST: "netcore-cache-0.netcore-cache"
  CACHE_PORT: {{ .Values.cache.port | quote }}
  server.py: |
    import os
    import json
    import socket
    from http.server import HTTPServer, BaseHTTPRequestHandler

    HOST = os.environ.get("BIND_HOST", "0.0.0.0")
    PORT = int(os.environ.get("PORT", "8000"))
    CACHE_HOST = os.environ.get("CACHE_HOST", "netcore-cache-0.netcore-cache")
    CACHE_PORT = int(os.environ.get("CACHE_PORT", "6379"))

    class APIHandler(BaseHTTPRequestHandler):
        def _send(self, code, data):
            payload = json.dumps(data).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                self._send(200, {"status": "ok", "service": "netcore-api"})
                return
            if self.path == "/network/status":
                try:
                    sock = socket.create_connection((CACHE_HOST, CACHE_PORT), timeout=2)
                    sock.close()
                    cache_status = "CONNECTED"
                except Exception as e:
                    cache_status = f"FAILED: {e}"

                self._send(200, {
                    "platform": "NetCore Cloud Network",
                    "status": "ONLINE",
                    "version": "v5.0.0",
                    "bind_address": f"{HOST}:{PORT}",
                    "stateful_cache": cache_status
                })
                return
            self._send(404, {"error": "not found"})

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        server = HTTPServer((HOST, PORT), APIHandler)
        server.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-vault-conf
  namespace: {{ .Values.global.secureNamespace }}
data:
  PORT: {{ .Values.vault.port | quote }}
  vault.py: |
    import os
    import json
    from http.server import HTTPServer, BaseHTTPRequestHandler

    PORT = int(os.environ.get("PORT", "8443"))

    class VaultHandler(BaseHTTPRequestHandler):
        def _send(self, code, data):
            payload = json.dumps(data).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                self._send(200, {"status": "ok", "service": "auth-vault"})
                return
            if self.path == "/vault/verify":
                self._send(200, {
                    "vault": "active",
                    "security_zone": "RESTRICTED",
                    "mtls": "enabled",
                    "handshake": "VERIFIED"
                })
                return
            self._send(404, {"error": "not found"})

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), VaultHandler)
        server.serve_forever()
