apiVersion: v1
kind: Service
metadata:
  name: netcore-gateway
  namespace: {{ .Values.global.primaryNamespace }}
spec:
  type: NodePort
  externalTrafficPolicy: {{ .Values.gateway.externalTrafficPolicy }}
  selector:
    app: netcore-gateway
    tier: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.servicePort }}
      targetPort: {{ .Values.gateway.namedPort }}
      nodePort: 30090
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcore-gateway
  namespace: {{ .Values.global.primaryNamespace }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: netcore-gateway
      tier: gateway
  template:
    metadata:
      labels:
        app: netcore-gateway
        tier: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway-http
              containerPort: {{ .Values.gateway.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.probePath }}
              port: gateway-http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.probePath }}
              port: gateway-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config-volume
          configMap:
            name: netcore-gateway-conf
