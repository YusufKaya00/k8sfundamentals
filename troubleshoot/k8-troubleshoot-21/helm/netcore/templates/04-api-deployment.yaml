apiVersion: v1
kind: Service
metadata:
  name: netcore-api
  namespace: {{ .Values.global.primaryNamespace }}
spec:
  type: ClusterIP
  selector:
    app: netcore-api
    tier: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: 8000
      protocol: {{ .Values.api.serviceProtocol }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcore-api
  namespace: {{ .Values.global.primaryNamespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: netcore-api
      tier: api
  template:
    metadata:
      labels:
        app: netcore-api
        tier: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /app/server.py
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: netcore-api-conf
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probePath }}
              port: 8000
              
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probePath }}
              port: 8000
              
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: app-code
              mountPath: /app/server.py
              subPath: server.py
      volumes:
        - name: app-code
          configMap:
            name: netcore-api-conf
