apiVersion: v1
kind: Service
metadata:
  name: auth-vault
  namespace: {{ .Values.global.secureNamespace }}
spec:
  type: ClusterIP
  selector:
    app: auth-vault
    tier: security
  ports:
    - name: http
      port: {{ .Values.vault.port }}
      targetPort: {{ .Values.vault.port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-vault
  namespace: {{ .Values.global.secureNamespace }}
spec:
  replicas: {{ .Values.vault.replicas }}
  selector:
    matchLabels:
      app: auth-vault
      tier: security
  template:
    metadata:
      labels:
        app: auth-vault
        tier: security
    spec:
      containers:
        - name: vault
          image: "{{ .Values.vault.image.repository }}:{{ .Values.vault.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /app/vault.py
          ports:
            - name: http
              containerPort: {{ .Values.vault.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.vault.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.vault.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
          volumeMounts:
            - name: app-code
              mountPath: /app/vault.py
              subPath: vault.py
      volumes:
        - name: app-code
          configMap:
            name: auth-vault-conf
