apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: pulse-prod
  labels:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/part-of: pulsemed
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-api
        app.kubernetes.io/part-of: pulsemed
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: telemetry-api
          image: docker.io/library/python:3.11-alpine
          command:
            - python3
            - -u
            - /app/server.py
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: code-volume
              mountPath: /app
              readOnly: true
      volumes:
        - name: code-volume
          configMap:
            name: api-code
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
  namespace: pulse-prod
  labels:
    app.kubernetes.io/name: telemetry-api
    app.kubernetes.io/part-of: pulsemed
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: telemetry-api
