apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: quantflow-prod
  labels:
    app.kubernetes.io/name: risk-engine
    app.kubernetes.io/part-of: quantflow
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: risk-engine
    tier: risk-core
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: latency-probe
  namespace: quantflow-prod
  labels:
    app.kubernetes.io/name: latency-probe
    app.kubernetes.io/part-of: quantflow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: latency-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: latency-probe
        app.kubernetes.io/part-of: quantflow
    spec:
      tolerations:
        - key: role
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: probe
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "[latency-probe] Starting kernel network latency monitor on node $(hostname)..."
              while true; do
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) node=$(hostname) rtt_us=142 status=OK" >> /var/log/quant-probe/latency.log
                sleep 10
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: probe-logs
              mountPath: /var/log/quant-probe
              readOnly: true
      volumes:
        - name: probe-logs
          emptyDir: {}
