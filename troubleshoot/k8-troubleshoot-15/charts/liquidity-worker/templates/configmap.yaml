apiVersion: v1
kind: ConfigMap
metadata:
  name: liquidity-worker-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: liquidity-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: quantflow
data:
  worker.py: |
    import json
    import os
    import socket
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PORT = int(os.environ.get("PORT", "9095"))
    REDIS_HOST = os.environ.get("REDIS_HOST", "quant-redis")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))

    print("[liquidity-worker] Allocating 48 MiB in-memory orderbook liquidity matrix...", flush=True)
    LIQUIDITY_MATRIX = bytearray(48 * 1024 * 1024)
    for i in range(0, len(LIQUIDITY_MATRIX), 4096):
        LIQUIDITY_MATRIX[i] = 1
    print("[liquidity-worker] Matrix allocation complete (48 MiB pinned).", flush=True)

    class LiquidityHandler(BaseHTTPRequestHandler):
        def _send_json(self, code, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                try:
                    with socket.create_connection((REDIS_HOST, REDIS_PORT), timeout=2):
                        pass
                    self._send_json(200, {
                        "status": "healthy",
                        "service": "liquidity-worker",
                        "matrix_buffer_mib": 48,
                        "redis": f"{REDIS_HOST}:{REDIS_PORT}"
                    })
                except Exception as exc:
                    self._send_json(503, {
                        "status": "unhealthy",
                        "error": str(exc)
                    })
                return

            self._send_json(404, {"error": "endpoint not found"})

        def log_message(self, format, *args):
            print(f"[liquidity-worker] {self.address_string()} - {format % args}", flush=True)

    if __name__ == "__main__":
        print(f"[liquidity-worker] Listening on 0.0.0.0:{PORT}...", flush=True)
        HTTPServer(("0.0.0.0", PORT), LiquidityHandler).serve_forever()
