apiVersion: v1
kind: Service
metadata:
  name: flight-gateway
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: flight-gateway
    app.kubernetes.io/part-of: aero-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flight-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-gateway
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: flight-gateway
    app.kubernetes.io/part-of: aero-ops
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: flight-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flight-gateway
        app.kubernetes.io/part-of: aero-ops
        tier: web
    spec:
      nodeSelector:
        tier: web

      containers:
      - name: gateway
        image: docker.io/library/nginx:1.25-alpine
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: gateway-nginx-conf
