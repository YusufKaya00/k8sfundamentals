apiVersion: v1
kind: Service
metadata:
  name: track-cache
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: track-cache
    app.kubernetes.io/part-of: aero-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: track-cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6380
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-cache
  namespace: aero-prod
  labels:
    app.kubernetes.io/name: track-cache
    app.kubernetes.io/part-of: aero-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: track-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: track-cache
        app.kubernetes.io/part-of: aero-ops
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
      - name: redis
        image: docker.io/library/redis:7.2-alpine
        command: ["redis-server", "--protected-mode", "no"]
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
