apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: troubleshoot-07-analytics-memory-stress
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
      - app
    labelSelectors:
      app.kubernetes.io/component: analytics-consumer
  stressors:
    memory:
      workers: 1
      size: "200MB"
  duration: "2m"
