apiVersion: v1
kind: Service
metadata:
  name: helix-db
  namespace: helix-prod
  labels:
    app.kubernetes.io/name: helix-db
    app.kubernetes.io/part-of: helix
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: helix-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: helix-db
  namespace: helix-prod
  labels:
    app.kubernetes.io/name: helix-db
    app.kubernetes.io/part-of: helix
spec:
  serviceName: helix-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helix-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helix-db
        app.kubernetes.io/part-of: helix
        tier: database
    spec:
      nodeSelector:
        tier: database
      tolerations:
        - key: workload
          operator: Equal
          value: database
          effect: NoSchedule
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          envFrom:
            - secretRef:
                name: helix-db-credentials
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: oci-bv
        resources:
          requests:
            storage: 50Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helix-db-ingress
  namespace: helix-prod
  labels:
    app.kubernetes.io/part-of: helix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helix-db
  policyTypes:
    - Ingress
  ingress:
    - from:
       - podSelector:
            matchLabels:
              app.kubernetes.io/name: helix-api
      ports:
        - protocol: TCP
          port: 5432
