# ==============================================================================
# SENARYO T8: SECRET ROTATION DESENKRONİZASYONU (DESYNC)
# ==============================================================================
# MİMARİ AÇIKLAMA:
# Kubernetes'te Pod ortam değişkenleri (envFrom: secretRef) konteyner başlatılırken
# enjekte edilir. Gizli anahtar (Secret) güncellendiğinde, çalışan Pod'ların
# ortam değişkenleri OTOMATİK OLARAK GÜNCELLENMEZ!
#
# EĞER `checksum/secret` ANNOTATION'I YOKSA:
# Helm veya `kubectl apply` ile Secret güncellense bile Deployment manifestosu
# değişmediği için Kubernetes RollingUpdate tetiklemez.
#
# SONUÇ:
# Eski Pod'lar bellekteki eski şifreyle çalışırken, yeni başlayan veya restart
# olan Pod'lar yeni şifreyi alır. RabbitMQ veya Veritabanı şifre rotasyonu
# yapıldığında `ACCESS_REFUSED` ve bağlantı kopmaları başlar (Split-Brain!).
#
# ÇÖZÜM:
# `helm-chart/values.yaml` içinde `credentials.rolloutOnChange: true` yapılır.
# Bu sayede `checksum/secret: {{ sha256sum }}` annotation'ı Pod template'i
# değiştirerek otomatik RollingUpdate tetikler!
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: resiliencestream-credentials-rotated
  namespace: app
type: Opaque
stringData:
  POSTGRES_PASSWORD: "RotatedPostgresPass2026!"
  RABBITMQ_PASSWORD: "RotatedRabbitMQPass2026!"
  REDIS_PASSWORD: "RotatedRedisPass2026!"
  CASSANDRA_PASSWORD: "RotatedCassandraPass2026!"
