apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: troubleshoot-04-postgres-delay-pool
  namespace: chaos-mesh
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - data
    labelSelectors:
      app.kubernetes.io/name: postgresql
  delay:
    latency: "1000ms"
    jitter: "100ms"
    correlation: "50"
  direction: to
  duration: "3m"
