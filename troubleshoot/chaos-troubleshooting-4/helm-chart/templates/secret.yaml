apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.credentials.postgresPassword | default "AdminPassword2026!" | quote }}
  RABBITMQ_PASSWORD: {{ .Values.credentials.rabbitmqPassword | default "AdminPassword2026!" | quote }}
  REDIS_PASSWORD: {{ .Values.credentials.redisPassword | default "AdminPassword2026!" | quote }}
  CASSANDRA_PASSWORD: {{ .Values.credentials.cassandraPassword | default "AdminPassword2026!" | quote }}
