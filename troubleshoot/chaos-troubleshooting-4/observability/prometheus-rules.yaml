# ==============================================================================
# RESILIENCESTREAM SRE & KAOS MÜHENDİSLİĞİ ALARM KURALLARI (PrometheusRule CRD)
# ==============================================================================
# MİMARİ STANDARTLAR:
# 1. `metadata.labels.release: monitoring`: `kube-prometheus-stack` (Prometheus
#    Operator) yalnızca kendi release etiketiyle eşleşen `PrometheusRule`
#    objelerini otomatik olarak tarar ve yükler.
# 2. Multi-Window Multi-Burn-Rate (Google SRE Standardı):
#    - 1 Saatlik Pencere (14.4x Burn Rate): 1 saatte bütçenin %2'sini yakar -> Pager/Critical.
#    - 6 Saatlik Pencere (6.0x Burn Rate): 6 saatte bütçenin %5'ini yakar -> Ticket/Warning.
# 3. DevOps Game Day Altyapı Hata Modları:
#    - Postgres bağlantı tükenmesi (max_connections: 20 sınırı)
#    - Redis bellek taşması (maxmemory: 16MB ve noeviction)
#    - HPA CPU metrik eksikliği (requests eksikliği)
#    - İstemci yeniden deneme fırtınası (Retry Storm)
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resiliencestream-sre-rules
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: resiliencestream
spec:
  groups:
    - name: resiliencestream.slo.burnrate
      interval: 5s
      rules:
        # 1. GOOGLE SRE MULTI-WINDOW BURN RATE (1h / 5m Window -> 14.4x Burn Rate)
        - alert: ErrorBudgetBurnRateCritical
          expr: |
            (
              (
                (sum(rate(rs_http_requests_total{status=~"5..", endpoint!~"/metrics"}[1h])) or sum(rate(rs_client_http_requests_total{status=~"5.."}[1h])) or vector(0))
                /
                clamp_min(sum(rate(rs_http_requests_total{endpoint!~"/metrics"}[1h])) or sum(rate(rs_client_http_requests_total[1h])), 0.0001)
              ) / 0.01 > 14.4
            )
            and
            (
              (
                (sum(rate(rs_http_requests_total{status=~"5..", endpoint!~"/metrics"}[5m])) or sum(rate(rs_client_http_requests_total{status=~"5.."}[5m])) or vector(0))
                /
                clamp_min(sum(rate(rs_http_requests_total{endpoint!~"/metrics"}[5m])) or sum(rate(rs_client_http_requests_total[5m])), 0.0001)
              ) / 0.01 > 14.4
            )
          for: 1m
          labels:
            severity: critical
            team: sre
            category: slo-burn-rate
          annotations:
            summary: "KRİTİK SLO YANMA HIZI: 1 saatte hata bütçesinin %2'si tükeniyor (14.4x burn rate)!"
            description: "Hem 1 saatlik hem 5 dakikalık pencerelerde HTTP 5xx hata oranı SLO hata bütçesini kritik hızla tüketiyor. Acil müdahale gereklidir."

        # 2. GOOGLE SRE MULTI-WINDOW BURN RATE (6h / 30m Window -> 6.0x Burn Rate)
        - alert: ErrorBudgetBurnRateWarning
          expr: |
            (
              (
                (sum(rate(rs_http_requests_total{status=~"5..", endpoint!~"/metrics"}[6h])) or sum(rate(rs_client_http_requests_total{status=~"5.."}[6h])) or vector(0))
                /
                clamp_min(sum(rate(rs_http_requests_total{endpoint!~"/metrics"}[6h])) or sum(rate(rs_client_http_requests_total[6h])), 0.0001)
              ) / 0.01 > 6.0
            )
            and
            (
              (
                (sum(rate(rs_http_requests_total{status=~"5..", endpoint!~"/metrics"}[30m])) or sum(rate(rs_client_http_requests_total{status=~"5.."}[30m])) or vector(0))
                /
                clamp_min(sum(rate(rs_http_requests_total{endpoint!~"/metrics"}[30m])) or sum(rate(rs_client_http_requests_total[30m])), 0.0001)
              ) / 0.01 > 6.0
            )
          for: 2m
          labels:
            severity: warning
            team: sre
            category: slo-burn-rate
          annotations:
            summary: "UYARI: 6 saatlik pencerede hata bütçesi tüketimi yüksek (6.0x burn rate)!"
            description: "Sistem 6 saatlik pencerede hata bütçesinin %5'ini tüketecek hızda hata üretiyor."

        # 3. HTTP P99 GECİKME SLO ALARMI (> 1.0s)
        - alert: ResilienceStreamHighLatencyP99
          expr: |
            histogram_quantile(
              0.99,
              sum by (le, endpoint) (rate(rs_http_request_duration_seconds_bucket{endpoint=~"/api/orders|/api/status"}[1m]))
            ) > 1.0
          for: 15s
          labels:
            severity: warning
            team: sre
            category: slo
          annotations:
            summary: "UYARI: HTTP p99 yanıt gecikmesi 1.0 saniye SLO sınırını aştı!"
            description: "Endpoint {{ $labels.endpoint }} için p99 gecikmesi {{ $value | printf \"%.2f\" }} saniyeye yükseldi."

    - name: resiliencestream.devops.failures
      interval: 5s
      rules:
        # 4. POSTGRES BAĞLANTI TÜKENMESİ (T2 Kök Neden)
        - alert: PostgresConnectionsNearLimit
          expr: (sum(pg_stat_activity_count) or (sum(rs_db_connections_active))) >= 18
          for: 10s
          labels:
            severity: critical
            team: dba-sre
            category: database
          annotations:
            summary: "KRİTİK: PostgreSQL bağlantı sayısı sınırına (max_connections: 20) yaklaştı!"
            description: "Aktif veritabanı bağlantı sayısı {{ $value }} / 20. Yeni siparişler 'sorry, too many clients already' ile reddedilebilir."

        # 5. REDIS BELLEK DOLULUĞU VE NOEVICTION HATASI (T5 Kök Neden)
        - alert: RedisMemoryNearLimit
          expr: (sum(redis_memory_used_bytes) or sum(container_memory_working_set_bytes{container="redis"})) > 14000000
          for: 10s
          labels:
            severity: warning
            team: infra-sre
            category: cache
          annotations:
            summary: "UYARI: Redis bellek kullanımı 14MB üzerine çıktı (Sınır: 16MB)!"
            description: "Redis noeviction modunda çalıştığı için 16MB aşıldığında tüm yazma işlemleri OOM hatasıyla reddedilecektir."

        # 6. RETRY STORM (YENİDEN DENEME FIRTINASI) ALGILANDI (T6 Kök Neden)
        - alert: ClientRetryStormDetected
          expr: |
            (sum(rate(rs_client_http_requests_total[1m])) > (sum(rate(rs_http_requests_total{endpoint=~"/api/orders"}[1m])) * 2.5))
            and
            (sum(rate(rs_client_http_requests_total[1m])) > 10)
          for: 10s
          labels:
            severity: critical
            team: app-sre
            category: traffic
          annotations:
            summary: "KRİTİK: İstemcide Retry Storm (Yeniden Deneme Fırtınası) algılandı!"
            description: "İstemci giden istek hızı ({{ $value }} req/s) sunucu sipariş işleme hızının 2.5 katından fazla. Üstel geri çekilme (exponential backoff) uygulanmıyor."

        # 7. POD YENİDEN BAŞLATMA (Liveness Probe & OOMKilled Cascading) (T1 Kök Neden)
        - alert: ResilienceStreamPodRestartSpike
          expr: sum by (container) (increase(kube_pod_container_status_restarts_total{namespace=~"default|app"}[5m])) > 0
          for: 0s
          labels:
            severity: warning
            team: infra-sre
            category: kubernetes
          annotations:
            summary: "UYARI: {{ $labels.container }} konteynerinde yeniden başlatma (restart) saptandı!"
            description: "Liveness probe başarısızlığı veya CrashLoopBackOff. Liveness probe'un bağımlılıklara bakıp bakmadığını kontrol edin."

        # 8. KAFKA ASENKRON TÜKETİCİ GERİLİĞİ (T7 NetworkPolicy Sessiz Düşüş)
        - alert: KafkaConsumerLagHigh
          expr: (sum by (topic) (kafka_consumergroup_lag{consumergroup="analytics-consumer"}) or (clamp_min(sum(rs_orders_created_total{result="success"}) - sum(rs_analytics_events_processed_total), 0))) > 40
          for: 15s
          labels:
            severity: warning
            team: streaming-sre
            category: messaging
          annotations:
            summary: "UYARI: analytics-consumer Kafka kuyruk geriliği artıyor (Lag: {{ $value }})!"
            description: "Cassandra yazma hatası veya NetworkPolicy engellemesi nedeniyle asenkron veri tüketimi durmuş olabilir."
