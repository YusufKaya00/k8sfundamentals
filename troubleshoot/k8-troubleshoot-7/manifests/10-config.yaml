apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-config
  namespace: nexus-prod
  labels:
    app.kubernetes.io/part-of: nexus-logistics
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  DB_HOST: "dispatch-db"
  DB_PORT: "5432"
  DB_NAME: "nexus_dispatch"
  QUEUE_HOST: "event-queue"
  QUEUE_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: nexus-prod
  labels:
    app.kubernetes.io/part-of: nexus-logistics
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Upstream backend definition for routing microservice
        upstream routing_backend {
            server routing-engine:8080;
        }

        server {
            listen 8080;
            server_name _;

            # Gateway L7 Healthcheck Endpoint
            location = /healthz {
                access_log off;
                default_type application/json;
                return 200 '{"status":"healthy","service":"dispatch-gateway"}\n';
            }

            # Forward routing requests to upstream backend
            location /api/v1/routes {
                proxy_pass http://routing_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_connect_timeout 3s;
                proxy_read_timeout 5s;
            }
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus-prod
  labels:
    app.kubernetes.io/part-of: nexus-logistics
type: Opaque
stringData:
  DB_USER: "nexus_admin"
  DB_PASSWORD: "NexusSecurePass2026!"
  QUEUE_AUTH_TOKEN: "nexus-token-alpha-99x"
