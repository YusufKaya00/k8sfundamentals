apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: queue-data-pvc
  namespace: nexus-prod
  labels:
    app.kubernetes.io/name: event-queue
    app.kubernetes.io/part-of: nexus-logistics
spec:
  # BUG INC-701: StorageClass fast-nvme-storage does not exist on this cluster
  storageClassName: "fast-nvme-storage"
  # BUG INC-701: Block volume CSI rejects ReadWriteMany (only ReadWriteOnce is supported)
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: event-queue
  namespace: nexus-prod
  labels:
    app.kubernetes.io/name: event-queue
    app.kubernetes.io/part-of: nexus-logistics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: event-queue
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: event-queue
  namespace: nexus-prod
  labels:
    app.kubernetes.io/name: event-queue
    app.kubernetes.io/part-of: nexus-logistics
spec:
  serviceName: "event-queue"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-queue
        app.kubernetes.io/part-of: nexus-logistics
    spec:
      containers:
      - name: queue
        image: docker.io/library/redis:7.2-alpine
        command:
        - redis-server
        - --requirepass
        - nexus-token-alpha-99x
        - --dir
        - /data
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: queue-storage
          mountPath: /data
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      volumes:
      - name: queue-storage
        persistentVolumeClaim:
          claimName: queue-data-pvc
