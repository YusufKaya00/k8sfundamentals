# ==============================================================================
# K8S CHAOS & TROUBLESHOOTING LAB — ÇÖZÜLMÜŞ REFERANS DEĞERLERİ (values-fixed.yaml)
# ==============================================================================
# Bu dosya, Deney 4, 5 ve 6'daki 3 yapılandırma hatasının tamamının düzeltilmiş
# (Production-Ready) halidir.
# ==============================================================================

replicaCount: 2

image:
  repository: yusufk00/resiliencestream
  tag: "latest"
  pullPolicy: Always

# ✅ ÇÖZÜM #1: Liveness Probe `/healthz` uç noktasına alındı ve timeout 3s yapıldı.
apiProbes:
  livenessProbe:
    path: "/healthz"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    path: "/readyz"
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# ✅ ÇÖZÜM #2: `paymentWorker.replicaCount: 2` yapılarak tek hata noktası (SPOF) giderildi.
workers:
  analyticsConsumer:
    enabled: true
    replicaCount: 1
  paymentWorker:
    enabled: true
    replicaCount: 2

# ✅ ÇÖZÜM #3: `analyticsResources.limits.memory: 256Mi` yapılarak OOMKilled önlendi.
analyticsResources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

paymentResources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 256Mi

nodeSelector:
  tier: app

tolerations: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: app.9.205.90.176.nip.io

pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: true
  paymentWorkerEnabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

serviceMonitor:
  enabled: true
  interval: 5s
  scrapeTimeout: 4s
  path: /metrics
  additionalLabels:
    release: monitoring

env:
  KAFKA_BOOTSTRAP: "kafka.data.svc.cluster.local:9092"
  KAFKA_TOPIC: "orders.events"
  KAFKA_GROUP: "analytics-consumer"
  CASSANDRA_HOSTS: "cassandra.data.svc.cluster.local"
  CASSANDRA_PORT: "9042"
  CASSANDRA_USER: "resilience"
  CASSANDRA_PASSWORD: "AdminPassword2026!"
  CASSANDRA_KEYSPACE: "resilience"
  POSTGRES_HOST: "postgres-postgresql.data.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "resilience"
  POSTGRES_PASSWORD: "AdminPassword2026!"
  POSTGRES_DB: "resilience"
  RABBITMQ_HOST: "rabbitmq.messaging.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "resilience"
  RABBITMQ_PASSWORD: "AdminPassword2026!"
  RABBITMQ_QUEUE: "payments"
  RABBITMQ_DLQ: "payments.dlq"
  RABBITMQ_MAX_RETRIES: "3"
  REDIS_HOST: "redis-master.messaging.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "AdminPassword2026!"
  DEP_TIMEOUT_SECONDS: "2"
  HEALTH_PROBE_INTERVAL: "5"
  PAYMENT_FAILURE_RATE: "0.0"
