apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aether-ingress
  namespace: aether-prod
  labels:
    app.kubernetes.io/name: aether-ingress
    app.kubernetes.io/part-of: aethermesh
  annotations:
    kubernetes.io/ingress.class: nginx-internal
spec:
  ingressClassName: nginx-internal
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aether-gateway
                port:
                  number: 8080
