apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-ingress
  namespace: aegis-prod
  labels:
    app.kubernetes.io/name: aegis-ingress
    app.kubernetes.io/part-of: aegisgrid
spec:
  ingressClassName: nginx
  rules:
    - host: aegis.local
      http:
        paths:
          - path: /api/v1/threats
            pathType: Prefix
            backend:
              service:
                name: aegis-gateway
                port:
                  number: 80
