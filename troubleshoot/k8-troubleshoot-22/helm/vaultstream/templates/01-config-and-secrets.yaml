apiVersion: v1
kind: Secret
metadata:
  name: vaultstream-hsm-secret
  namespace: {{ .Values.global.coreNamespace }}
type: Opaque
stringData:
  hsm_signing_key: {{ .Values.signer.signingSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-conf
  namespace: {{ .Values.global.coreNamespace }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /settlement/status {
            proxy_pass http://settlement-engine:8081/settlement/status;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }

        location /pci/verify {
            proxy_pass http://pci-signer.{{ .Values.global.pciNamespace }}.svc.cluster.local:8443/pci/verify;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-engine-conf
  namespace: {{ .Values.global.coreNamespace }}
data:
  PORT: {{ .Values.engine.port | quote }}
  LEDGER_HOST: "ledger-db-0.ledger-db"
  LEDGER_PORT: {{ .Values.ledger.port | quote }}
  SIGNER_URL: "http://pci-signer.{{ .Values.global.pciNamespace }}.svc.cluster.local:8443/pci/verify"
  engine.py: |
    import os
    import json
    import socket
    import urllib.request
    from http.server import HTTPServer, BaseHTTPRequestHandler

    PORT = int(os.environ.get("PORT", "8081"))
    LEDGER_HOST = os.environ.get("LEDGER_HOST", "ledger-db-0.ledger-db")
    LEDGER_PORT = int(os.environ.get("LEDGER_PORT", "6379"))
    SIGNER_URL = os.environ.get("SIGNER_URL", "http://pci-signer.vaultstream-pci.svc.cluster.local:8443/pci/verify")

    class EngineHandler(BaseHTTPRequestHandler):
        def _send(self, code, data):
            payload = json.dumps(data).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                self._send(200, {"status": "ok", "service": "settlement-engine"})
                return
            if self.path == "/settlement/status":
                try:
                    sock = socket.create_connection((LEDGER_HOST, LEDGER_PORT), timeout=2)
                    sock.close()
                    ledger_state = "CONNECTED"
                except Exception as e:
                    ledger_state = f"FAILED: {e}"

                try:
                    with urllib.request.urlopen(SIGNER_URL, timeout=2) as resp:
                        signer_state = "VERIFIED" if resp.status == 200 else f"HTTP_{resp.status}"
                except Exception as e:
                    signer_state = f"FAILED: {e}"

                self._send(200, {
                    "platform": "VaultStream Zero-Trust Settlement",
                    "status": "ONLINE",
                    "version": "v6.0.0",
                    "ledger_db": ledger_state,
                    "pci_signer": signer_state
                })
                return
            self._send(404, {"error": "not found"})

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), EngineHandler)
        server.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pci-signer-conf
  namespace: {{ .Values.global.pciNamespace }}
data:
  PORT: {{ .Values.signer.port | quote }}
  signer.py: |
    import os
    import json
    from http.server import HTTPServer, BaseHTTPRequestHandler

    PORT = int(os.environ.get("PORT", "8443"))

    class SignerHandler(BaseHTTPRequestHandler):
        def _send(self, code, data):
            payload = json.dumps(data).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                self._send(200, {"status": "ok", "service": "pci-signer"})
                return
            if self.path == "/pci/verify":
                self._send(200, {
                    "hsm": "ONLINE",
                    "pci_zone": "RESTRICTED",
                    "signature": "VALID"
                })
                return
            self._send(404, {"error": "not found"})

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), SignerHandler)
        server.serve_forever()
