apiVersion: v1
kind: Service
metadata:
  name: pci-signer
  namespace: {{ .Values.global.pciNamespace }}
spec:
  type: ClusterIP
  selector:
    app: pci-signer
    tier: pci-security
  ports:
    - name: http
      port: {{ .Values.signer.port }}
      targetPort: {{ .Values.signer.port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pci-signer
  namespace: {{ .Values.global.pciNamespace }}
spec:
  replicas: {{ .Values.signer.replicas }}
  selector:
    matchLabels:
      app: pci-signer
      tier: pci-security
  template:
    metadata:
      labels:
        app: pci-signer
        tier: pci-security
    spec:
      containers:
        - name: signer
          image: "{{ .Values.signer.image.repository }}:{{ .Values.signer.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /app/signer.py
          ports:
            - name: http
              containerPort: {{ .Values.signer.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.signer.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.signer.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.signer.resources | nindent 12 }}
          volumeMounts:
            - name: app-code
              mountPath: /app/signer.py
              subPath: signer.py
      volumes:
        - name: app-code
          configMap:
            name: pci-signer-conf
