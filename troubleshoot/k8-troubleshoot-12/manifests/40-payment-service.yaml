apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: vortex
data:
  PORT: "8082"
  DB_HOST: "vortex-db"
  DB_PORT: "5432"
  AUTH_SERVICE_URL: "http://auth-service:8081/verify"
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json
    import os
    import socket
    import sys
    import urllib.request
    import urllib.error

    PORT = int(os.environ.get("PORT", "8082"))
    DB_HOST = os.environ.get("DB_HOST", "vortex-db")
    DB_PORT = int(os.environ.get("DB_PORT", "5432"))
    AUTH_SERVICE_URL = os.environ.get("AUTH_SERVICE_URL", "http://auth-service:8081/verify")

    def check_tcp(host, port, timeout=2.0):
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(timeout)
            s.connect((host, port))
            s.close()
            return True, "connected"
        except Exception as e:
            return False, str(e)

    def verify_auth():
        try:
            req = urllib.request.Request(AUTH_SERVICE_URL, headers={"User-Agent": "payment-service/1.0"})
            with urllib.request.urlopen(req, timeout=3.0) as resp:
                if resp.status == 200:
                    data = json.loads(resp.read().decode("utf-8"))
                    return data.get("authenticated", False), data
                return False, f"Auth service status: {resp.status}"
        except Exception as e:
            return False, str(e)

    class PaymentHandler(BaseHTTPRequestHandler):
        def _send_json(self, code, payload):
            data = json.dumps(payload, indent=2).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/healthz":
                self._send_json(200, {"status": "healthy", "service": "payment-service"})
                return

            if self.path == "/ready":
                db_ok, db_err = check_tcp(DB_HOST, DB_PORT)
                self._send_json(200 if db_ok else 503, {
                    "ready": db_ok,
                    "database": {"host": DB_HOST, "port": DB_PORT, "reachable": db_ok, "detail": db_err}
                })
                return

            if self.path in ("/process", "/api/v1/payments/process", "/api/v1/payments"):
                auth_ok, auth_detail = verify_auth()
                if not auth_ok:
                    self._send_json(401, {
                        "error": "authentication_failed",
                        "detail": auth_detail
                    })
                    return

                db_ok, db_err = check_tcp(DB_HOST, DB_PORT)
                if not db_ok:
                    self._send_json(503, {
                        "error": "database_unavailable",
                        "detail": db_err
                    })
                    return

                self._send_json(200, {
                    "status": "success",
                    "service": "payment-service",
                    "transaction_id": "tx_vortex_7712",
                    "amount": 150.00,
                    "currency": "USD"
                })
                return

            self._send_json(404, {"error": "not_found", "path": self.path})

        def do_POST(self):
            if self.path in ("/process", "/api/v1/payments/process", "/api/v1/payments"):
                self.do_GET()
                return
            self._send_json(404, {"error": "not_found", "path": self.path})

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format % args))
            sys.stdout.flush()

    if __name__ == "__main__":
        print(f"Starting payment-service on port {PORT}...", flush=True)
        server = HTTPServer(("0.0.0.0", PORT), PaymentHandler)
        server.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: vortex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: vortex
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: vortex
        tier: web
    spec:
      nodeSelector:
        tier: web
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
      containers:
        - name: payment-service
          image: docker.io/library/python:3.12-slim
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: payment-service-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app
      volumes:
        - name: config
          configMap:
            name: payment-service-config
