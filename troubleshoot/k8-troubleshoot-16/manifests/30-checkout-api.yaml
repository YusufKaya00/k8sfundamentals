apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-api-config
  namespace: omnicore-prod
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: omnicore
data:
  PORT: "8000"
  DB_HOST: "omnicore-db"
  DB_PORT: "5432"
  REDIS_HOST: "omnicore-redis"
  REDIS_PORT: "6379"
  CATALOG_HOST: "catalog-worker"
  CATALOG_PORT: "9090"
  REQUIRED_TOKEN: "omnicore-verified"
  server.py: |
    import json
    import os
    import socket
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PORT = int(os.environ.get("PORT", "8000"))
    DB_HOST = os.environ.get("DB_HOST", "omnicore-db")
    DB_PORT = int(os.environ.get("DB_PORT", "5432"))
    REDIS_HOST = os.environ.get("REDIS_HOST", "omnicore-redis")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))
    CATALOG_HOST = os.environ.get("CATALOG_HOST", "catalog-worker")
    CATALOG_PORT = int(os.environ.get("CATALOG_PORT", "9090"))
    REQUIRED_TOKEN = os.environ.get("REQUIRED_TOKEN", "omnicore-verified")

    class CheckoutHandler(BaseHTTPRequestHandler):
        def _send_json(self, status_code, data):
            payload = json.dumps(data).encode("utf-8")
            self.send_response(status_code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                self._send_json(200, {"status": "alive", "service": "checkout-api"})
                return

            if self.path == "/ready":
                try:
                    with socket.create_connection((DB_HOST, DB_PORT), timeout=2):
                        pass
                    with socket.create_connection((REDIS_HOST, REDIS_PORT), timeout=2):
                        pass
                    catalog_url = f"http://{CATALOG_HOST}:{CATALOG_PORT}/healthz"
                    with urllib.request.urlopen(catalog_url, timeout=2) as resp:
                        if resp.status != 200:
                            raise RuntimeError(f"catalog-worker returned HTTP {resp.status}")
                    self._send_json(200, {
                        "status": "ready",
                        "db": f"{DB_HOST}:{DB_PORT}",
                        "redis": f"{REDIS_HOST}:{REDIS_PORT}",
                        "catalog": f"{CATALOG_HOST}:{CATALOG_PORT}"
                    })
                except Exception as e:
                    self._send_json(503, {
                        "status": "not_ready",
                        "catalog_target": f"{CATALOG_HOST}:{CATALOG_PORT}",
                        "error": str(e)
                    })
                return

            if self.path == "/api/v1/checkout":
                token = self.headers.get("X-Omni-Token")
                if token != REQUIRED_TOKEN:
                    self._send_json(403, {
                        "error": "untrusted gateway: invalid or missing X-Omni-Token header"
                    })
                    return
                self._send_json(200, {
                    "platform": "OmniCore",
                    "status": "ORDER_COMMITTED",
                    "verified_accounts": ["ACC-CORE-01", "ACC-CORE-02", "ACC-CORE-03", "ACC-CORE-04"],
                    "catalog_engine": "online"
                })
                return

            self._send_json(404, {"error": "route not found"})

        def log_message(self, format, *args):
            print(f"[checkout-api] {self.address_string()} - {format % args}", flush=True)

    if __name__ == "__main__":
        print(f"Starting checkout-api on 0.0.0.0:{PORT}...", flush=True)
        server = HTTPServer(("0.0.0.0", PORT), CheckoutHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: omnicore-prod
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: omnicore
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: omnicore
    spec:
      nodeSelector:
        tier: web
      affinity:
        podAntiAffinity:
           preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: checkout-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: checkout-api
          image: docker.io/library/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /app/server.py
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: checkout-api-config
        
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: checkout-api-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-api-pdb
  namespace: omnicore-prod
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: omnicore
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
