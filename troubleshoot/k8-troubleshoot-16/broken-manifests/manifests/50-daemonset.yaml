apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-telemetry
  namespace: omnicore-prod
  labels:
    app.kubernetes.io/name: node-telemetry
    app.kubernetes.io/part-of: omnicore
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-telemetry
        app.kubernetes.io/part-of: omnicore
    spec:
      tolerations:
        - key: role
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: telemetry
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              echo "[node-telemetry] Starting host health agent on node $(hostname)..."
              while true; do
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) node=$(hostname) disk_io=OK net_drop=0" >> /var/log/omnicore-node/telemetry.log
                sleep 10
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: telemetry-logs
              mountPath: /var/log/omnicore-node
              readOnly: true
      volumes:
        - name: telemetry-logs
          emptyDir: {}
