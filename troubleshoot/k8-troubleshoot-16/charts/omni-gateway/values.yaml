replicaCount: 1

image:
  repository: docker.io/library/nginx
  tag: "1.25-alpine"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  nodePort: 30086
  externalTrafficPolicy: Cluster

upstream:
  host: "checkout-api"
  port: 8000

gateway:
  authToken: "omnicore-verified"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
