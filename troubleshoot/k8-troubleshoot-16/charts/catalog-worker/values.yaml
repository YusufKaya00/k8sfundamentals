replicaCount: 1

image:
  repository: docker.io/library/python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

initImage:
  repository: docker.io/library/busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9090
  targetPort: 9090

db:
  host: "omnicore-db"
  port: 5432

redis:
  host: "omnicore-redis"
  port: 6379

startupProbe:
  path: "/healthz"
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 10

livenessProbe:
  path: "/healthz"
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: "/healthz"
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 250Mi
