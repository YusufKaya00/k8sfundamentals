namespace: paynexus-prod

webapp:
  replicas: 3
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.27-alpine"
  containerPort: 8080
  servicePort: 80
  probePath: /ready
  resources:
    limits:
      cpu: "400m"
      memory: "6Mi"
    requests:
      cpu: "100m"
      memory: "2Mi"
db:
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  storageClassName: "managed-csi"
  storageSize: 4Gi
  user: "payuser"
  database: "paynexus"
  passwordPlain: "NexusMasterPass2026!"

sharedStorage:
  storageClassName: "azurefile-csi"
  accessMode: "ReadWriteMany"
  size: 2Gi

cronjob:
  schedule: "*/1 * * * *"
  suspend: true

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  minAvailable: 3

ingress:
  className: nginx
