apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.webapp.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
      tier: frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
        tier: frontend
    spec:
      initContainers:
        - name: verify-cache-handshake
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-cache-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ .Release.Name }}-cache -p {{ .Values.cache.port }} ping | grep -q PONG; do
                echo "Waiting for Redis cache authentication and readiness..."
                sleep 2
              done
      containers:
        - name: web
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}"
          ports:
            - containerPort: {{ .Values.webapp.containerPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.webapp.probePath }}
              port: {{ .Values.webapp.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.webapp.probePath }}
              port: {{ .Values.webapp.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html-volume
          configMap:
            name: {{ .Release.Name }}-html
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-html
