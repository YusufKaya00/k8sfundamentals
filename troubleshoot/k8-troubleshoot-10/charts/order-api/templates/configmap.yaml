apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-api.fullname" . }}-config
  labels:
    {{- include "order-api.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.config.dbHost | default "state-db" | quote }}
  DB_PORT: {{ .Values.config.dbPort | default "5432" | quote }}
  INVENTORY_HOST: {{ .Values.config.inventoryHost | default "inventory-worker" | quote }}
  INVENTORY_PORT: {{ .Values.config.inventoryPort | default "9000" | quote }}
  PORT: {{ .Values.config.port | default "8000" | quote }}
  server.py: |
    import http.server
    import json
    import os
    import socket
    import sys
    import urllib.parse

    class OrderAPIHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            sys.stderr.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format % args))
            sys.stderr.flush()

        def do_GET(self):
            parsed_url = urllib.parse.urlparse(self.path)
            if parsed_url.path == '/health':
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"status": "healthy"}).encode('utf-8'))
            elif parsed_url.path == '/ready':
                db_host = os.environ.get('DB_HOST', 'state-db')
                db_port = int(os.environ.get('DB_PORT', '5432'))
                inv_host = os.environ.get('INVENTORY_HOST', 'inventory-worker')
                inv_port = int(os.environ.get('INVENTORY_PORT', '9000'))

                def check_tcp(host, port, timeout=2.0):
                    try:
                        with socket.create_connection((host, port), timeout=timeout):
                            return True
                    except Exception:
                        return False

                db_ok = check_tcp(db_host, db_port)
                inv_ok = check_tcp(inv_host, inv_port)

                if db_ok and inv_ok:
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        "status": "ready",
                        "database": "connected",
                        "inventory": "connected"
                    }).encode('utf-8'))
                else:
                    self.send_response(503)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        "status": "unavailable",
                        "database": "connected" if db_ok else "disconnected",
                        "inventory": "connected" if inv_ok else "disconnected"
                    }).encode('utf-8'))
            elif parsed_url.path == '/api/v1/orders':
                gateway_header = self.headers.get('X-Chronos-Gateway')
                if gateway_header != 'verified':
                    self.send_response(403)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        "error": "untrusted proxy: missing X-Chronos-Gateway header"
                    }).encode('utf-8'))
                else:
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    orders_data = {
                        "status": "success",
                        "orders": [
                            {
                                "order_id": "ORD-7701",
                                "customer": "chronos-client",
                                "items": [
                                    {"sku": "CHRONO-SYNC", "quantity": 2, "price": 149.99}
                                ],
                                "total": 299.98,
                                "status": "confirmed"
                            },
                            {
                                "order_id": "ORD-7702",
                                "customer": "enterprise-user",
                                "items": [
                                    {"sku": "QUANTUM-CORE", "quantity": 1, "price": 899.00}
                                ],
                                "total": 899.00,
                                "status": "processing"
                            }
                        ]
                    }
                    self.wfile.write(json.dumps(orders_data).encode('utf-8'))
            else:
                self.send_response(404)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"error": "not found"}).encode('utf-8'))

    def main():
        port = int(os.environ.get('PORT', '8000'))
        server = http.server.ThreadingHTTPServer(('0.0.0.0', port), OrderAPIHandler)
        sys.stderr.write(f"Starting order-api server on port {port}...\n")
        sys.stderr.flush()
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            pass
        server.server_close()

    if __name__ == '__main__':
        main()
