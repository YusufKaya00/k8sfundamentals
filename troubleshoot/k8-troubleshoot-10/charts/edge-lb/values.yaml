replicaCount: 2

image:
  repository: docker.io/library/nginx
  tag: 1.25-alpine
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  externalTrafficPolicy: Cluster

proxy:
  gatewayHeader: "verified"

nodeSelector: {}

affinity: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
