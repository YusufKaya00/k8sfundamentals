apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: kontrol-01-order-api-packet-loss
  namespace: chaos-mesh
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - app
    labelSelectors:
      app.kubernetes.io/component: order-api
  loss:
    loss: "20"
    correlation: "25"
  direction: to
  duration: "2m"
