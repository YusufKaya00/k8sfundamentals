apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: kontrol-03-cassandra-delay-500ms
  namespace: chaos-mesh
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - data
    labelSelectors:
      app.kubernetes.io/name: cassandra
  delay:
    latency: "500ms"
    jitter: "50ms"
    correlation: "50"
  direction: to
  duration: "2m"
