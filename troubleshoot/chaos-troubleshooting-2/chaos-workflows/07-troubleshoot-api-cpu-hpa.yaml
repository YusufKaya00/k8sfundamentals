apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: troubleshoot-07-order-api-cpu-stress
  namespace: chaos-mesh
spec:
  mode: all
  selector:
    namespaces:
      - app
    labelSelectors:
      app.kubernetes.io/component: order-api
  stressors:
    cpu:
      workers: 1
      load: 80
  duration: "3m"
