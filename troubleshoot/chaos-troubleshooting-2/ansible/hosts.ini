# ==============================================================================
# CHAOS & TROUBLESHOOTING LAB 1 - AUTO-GENERATED ANSIBLE INVENTORY
# ==============================================================================
# Bu dosya Terraform `local_file.ansible_inventory` kaynağı ve `templatefile()`
# fonksiyonu tarafından otomatik olarak üretilmiştir.
# ==============================================================================

[master]
vm-master ansible_host=9.205.30.199 private_ip=10.30.1.4 node_role=control-plane

[workers]
vm-worker-app ansible_host=10.30.1.6 private_ip=10.30.1.6 worker_tier=app
vm-worker-data ansible_host=10.30.1.5 private_ip=10.30.1.5 worker_tier=data

[k8s_cluster:children]
master
workers

[all:vars]
ansible_user=ysf
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
master_private_ip=10.30.1.4
master_public_ip=9.205.30.199
app_public_ip=9.205.30.202
app_worker_public_ip=9.205.30.202

# Özel Alt Ağdaki Worker Düğümleri İçin SSH Bastion / Jump Host Tünel Ayarı
[workers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -W %h:%p ysf@9.205.30.199"'
