apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: order-api
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: order-api
    spec:
      containers:
        - name: order-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8000 }}
              protocol: TCP
          env:
            - name: APP_ROLE
              value: "api"
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.apiProbes.livenessProbe.path | default "/healthz" }}
              port: http
            initialDelaySeconds: {{ .Values.apiProbes.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.apiProbes.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.apiProbes.livenessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.apiProbes.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.apiProbes.readinessProbe.path | default "/readyz" }}
              port: http
            initialDelaySeconds: {{ .Values.apiProbes.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.apiProbes.readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.apiProbes.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.apiProbes.readinessProbe.failureThreshold | default 2 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.workers.analyticsConsumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-consumer
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analytics-consumer
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.workers.analyticsConsumer.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: analytics-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: analytics-consumer
    spec:
      containers:
        - name: analytics-consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8000 }}
              protocol: TCP
          env:
            - name: APP_ROLE
              value: "analytics"
            {{- range $key, $val := .Values.env }}
            {{- if ne $key "KAFKA_TOPIC" }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            - name: KAFKA_TOPIC
              value: {{ .Values.workers.analyticsConsumer.kafkaTopic | default .Values.env.KAFKA_TOPIC | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.analyticsResources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
---
{{- if .Values.workers.paymentWorker.enabled }}
