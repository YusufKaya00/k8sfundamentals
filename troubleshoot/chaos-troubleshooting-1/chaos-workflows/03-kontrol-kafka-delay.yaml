# ==============================================================================
# DENEY 03 (🟢 KONTROL TESTİ — PATLAMAZ)
# Hedef: Apache Kafka (`kafka-controller-0`, `namespace: data`) Ağ Gecikmesi
# Amaç : Kafka broker'da 300ms ağ gecikmesi oluştuğunda siparişlerin
#        kaybolmadığını ve `kafka-consumer-groups.sh` ile Consumer Lag'in
#        nasıl takip edildiğini öğrenmek.
# ==============================================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: exp03-kontrol-kafka-delay
  namespace: chaos-mesh
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - data
    labelSelectors:
      app.kubernetes.io/name: kafka
  delay:
    latency: "300ms"
    jitter: "50ms"
    correlation: "50"
  direction: to
  duration: "2m"
