# ==============================================================================
# DENEY 05 (🔴 TROUBLESHOOT TESTİ #2 — KUYRUK PATLAR / BİRİKİR!)
# Hedef: `payment-worker` (`namespace: app`) -> Pod Failure (`mode: one`)
# Neden Patlar?: `values.yaml` içinde `paymentWorker.replicaCount: 1` (Tek Kopya)
#                bırakılmıştır. Bu pod arızalandığında RabbitMQ `payments`
#                kuyruğunda `consumers: 0` olur ve tüm ödemeler kuyrukta birikir!
# Çözüm: `values.yaml` içinde `paymentWorker.replicaCount: 2` yapıp `helm upgrade`
#        çalıştırmak!
# ==============================================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: exp05-troubleshoot-payment-worker-failure
  namespace: chaos-mesh
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
      - app
    labelSelectors:
      app.kubernetes.io/component: payment-worker
  duration: "2m"
