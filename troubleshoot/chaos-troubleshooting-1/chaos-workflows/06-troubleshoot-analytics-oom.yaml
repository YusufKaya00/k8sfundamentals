# ==============================================================================
# DENEY 06 (🔴 TROUBLESHOOT TESTİ #3 — OOMKILLED & KAFKA LAG PATLAR!)
# Hedef: `analytics-consumer` (`namespace: app`) -> StressChaos (45MB RAM Yükü)
# Neden Patlar?: `values.yaml` içinde `analyticsResources.limits.memory: 80Mi`
#                çok dar bırakılmıştır. Python + Kafka + Cassandra istemcisi zaten
#                ~55MB kullanırken 45MB ek stres geldiğinde Linux OOM Killer podu
#                `OOMKilled (Exit Code 137)` ile öldürür ve Kafka'da LAG birikir!
# Çözüm: `values.yaml` içinde `analyticsResources.limits.memory: 256Mi` yapıp
#        `helm upgrade` çalıştırmak!
# ==============================================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: exp06-troubleshoot-analytics-oom
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
      - app
    labelSelectors:
      app.kubernetes.io/component: analytics-consumer
  stressors:
    memory:
      workers: 1
      size: "45MB"
  duration: "2m"
