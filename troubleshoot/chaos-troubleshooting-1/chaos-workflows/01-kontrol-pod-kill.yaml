# ==============================================================================
# DENEY 01 (🟢 KONTROL TESTİ — PATLAMAZ)
# Hedef: Kubernetes `order-api` (Pod Fault -> Pod Kill)
# Amaç : 2 replika çalışan `order-api` podlarından 1 tanesi aniden öldürüldüğünde
#        trafiğin diğer poda aktığını ve kesinti yaşanmadığını doğrulamak.
# ==============================================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: exp01-kontrol-pod-kill
  namespace: chaos-mesh
spec:
  action: pod-kill
  mode: one
  gracePeriod: 0
  selector:
    namespaces:
      - app
    labelSelectors:
      app.kubernetes.io/component: order-api
