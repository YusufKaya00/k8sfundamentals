apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: apex-prod
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: apexpay
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgresql
  selector:
    app.kubernetes.io/name: ledger-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-db
  namespace: apex-prod
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: apexpay
spec:
  serviceName: "ledger-db"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-db
        app.kubernetes.io/part-of: apexpay
    spec:
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "database"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values:
                      - database
   
      containers:
        - name: postgresql
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ledger-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/data"
          volumeMounts:
            - name: ledger-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: ledger-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "oci-bv"
        resources:
          requests:
            storage: 50Gi
