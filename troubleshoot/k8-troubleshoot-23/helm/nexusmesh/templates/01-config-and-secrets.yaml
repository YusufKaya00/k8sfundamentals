apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-gateway-conf
  namespace: {{ .Values.global.gatewayNamespace }}
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
        access_log /dev/stdout;
        error_log /dev/stderr info;

        server {
            listen 8080;
            server_name _;

            location /healthz {
                return 200 '{"status":"edge-proxy-ready"}\n';
                add_header Content-Type application/json;
            }

            location /stream {
                # [Upstream Configuration]
                proxy_pass http://stream-router.{{ .Values.global.meshNamespace }}.svc.cluster.local:8080/stream;
                proxy_connect_timeout 3s;
                proxy_read_timeout 3s;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /auth/token {
                proxy_pass http://token-vault.{{ .Values.global.secureNamespace }}.svc.cluster.local:8443/auth/token;
                proxy_connect_timeout 3s;
                proxy_read_timeout 3s;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stream-router-code
  namespace: {{ .Values.global.meshNamespace }}
data:
  server.py: |
    import http.server
    import json
    import os
    import sys

    PORT = 8080

    class StreamHandler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/healthz':
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"status": "ok", "service": "stream-router"}')
            elif self.path in ['/stream', '/api/v1/stream']:
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"stream": "active", "payload": "nexus-data-ok"}')
            else:
                self.send_response(404)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"error": "not_found"}')

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format % args))
            sys.stdout.flush()

    if __name__ == '__main__':
        server_address = ('0.0.0.0', PORT)
        httpd = http.server.HTTPServer(server_address, StreamHandler)
        print(f"stream-router listening on 0.0.0.0:{PORT}", flush=True)
        httpd.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: token-vault-code
  namespace: {{ .Values.global.secureNamespace }}
data:
  server.py: |
    import http.server
    import json
    import sys

    PORT = 8443

    class TokenHandler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            if self.path in ['/healthz', '/readyz']:
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"status": "token-vault-ready"}')
            elif self.path == '/auth/token':
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"token": "nexus-jwt-valid", "authorized": true}')
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format % args))
            sys.stdout.flush()

    if __name__ == '__main__':
        # [Localhost Bind Trap]: Only listens on 0.0.0.0 loopback
        server_address = ('0.0.0.0', PORT)
        httpd = http.server.HTTPServer(server_address, TokenHandler)
        print(f"token-vault listening on 0.0.0.0:{PORT}", flush=True)
        httpd.serve_forever()
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-token-secret
  namespace: {{ .Values.global.secureNamespace }}
type: Opaque
stringData:
  jwt_signing_key: "NexusSecureMasterKey2026!#"
