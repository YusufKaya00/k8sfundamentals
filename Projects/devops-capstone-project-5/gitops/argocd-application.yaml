# ==============================================================================
# ARGOCD GITOPS APPLICATION MANİFESTOSU (gitops/argocd-application.yaml)
# ==============================================================================
# MİMARİ AMAÇ:
# Geleneksel (Push-based) CI/CD boru hatlarında GitLab Runner içinden doğrudan
# `kubectl apply` veya `helm upgrade` çalıştırılır; bu da küme admin şifresinin
# (kubeconfig) dışarıya verilmesi gibi ciddi bir güvenlik riski doğurur.
#
# ArgoCD (Pull-based GitOps) ise kümenin İÇİNDE (`argocd` namespace'inde) yaşar:
# 1. Tek Doğruluk Kaynağı (Single Source of Truth) olarak GitHub deposundaki
#    `Projects/devops-capstone-project-5/app/chart` dizinini sürekli izler.
# 2. GitLab CI pipeline'ı (`gitops-promote` aşaması) yeni imaj etiketini (`image.tag`)
#    `values.yaml` dosyasına işleyip Git'e pushladığı anda ArgoCD değişikliği
#    (OutOfSync) algılar ve RKE2 kümesindeki Deployment'ları (`order-api`,
#    `analytics-consumer`, `payment-worker`) otomatik günceller!
# 3. `selfHeal: true` (Kendi Kendini İyileştirme): Bir kaos deneyi veya manuel
#    müdahale (`kubectl edit`/`scale`) sonrasında bildirimsel durumdan sapma
#    (Configuration Drift) oluşursa ArgoCD kümeyi otomatik olarak Git durumuna döndürür.
# 4. PROJE 4 DERS 7: ArgoCD Application Ingress host'u küçük harf ve geçerli bir
#    RFC 1123 DNS adı olmalıdır (Ansible kurulum sırasında `app.APP_IP.nip.io`
#    ifadesini gerçek küçük harfli IP ile değiştirir).
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resiliencestream
  namespace: argocd
  finalizers:
    # Uygulama ArgoCD'den silindiğinde oluşturduğu alt kaynakların da temizlenmesini sağlar
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # 1. KAYNAK (SOURCE): ArgoCD'nin izlediği Git Deposu ve Helm Chart Dizini
  source:
    repoURL: "https://github.com/YusufKaya00/k8sfundamentals.git"
    targetRevision: main
    path: Projects/devops-capstone-project-5/app/chart
    helm:
      # PROJE 4 DERS 7: Git'teki values.yaml içinde varsayılan host bulunsa bile
      # ArgoCD'nin selfHeal yaparken canlı Azure Public IP adresimizi ezmemesi için
      # dinamik Ingress Host parametresini burada açıkça belirtiyoruz
      # (Ansible 05-platform-services.yml kurulum sırasında APP_IP'yi gerçek IP ile değiştirir):
      parameters:
        - name: ingress.host
          value: "app.APP_IP.nip.io"

  # 2. HEDEF (DESTINATION): Uygulamanın kurulacağı Kubernetes Kümesi ve Namespace
  destination:
    server: "https://kubernetes.default.svc"
    namespace: app

  # 3. OTOMATİK SENKRONİZASYON VE SAPMA ÖNLEME (DRIFT RECONCILIATION) POLİTİKASI
  syncPolicy:
    automated:
      prune: true      # Git'ten kaldırılan kaynakları kümeden otomatik sil
      selfHeal: true   # Kümede yapılan manuel müdahaleleri (drift) otomatik ez ve Git durumuna döndür
    syncOptions:
      - CreateNamespace=true  # Hedef `app` namespace'i yoksa otomatik oluştur
