# ==============================================================================
# APACHE CASSANDRA (bitnami/cassandra) — DAĞITIK GENİŞ SÜTUNLU NOSQL VERİTABANI
# ==============================================================================
# MİMARİ AMAÇ:
# Apache Cassandra, ResilienceStream mimarisinde `analytics-consumer` tarafından
# Kafka'dan (`orders.events`) tüketilen yüksek hacimli olay kayıtlarını
# `resilience.order_events` tablosuna zaman serisi / geniş sütun (Wide-Column)
# yapısında yazmak için kullanılır.
#
# NEDEN PROD ORTAMINDA BÖYLEDİR VS LAB ORTAMI (768M HEAP KISITI)?
# - Prod'da: Cassandra "Masterless Ring" (Lidersiz Halka) mimarisiyle en az 3
#   veya 6 düğümde, `Replication Factor (RF) = 3` ve `LOCAL_QUORUM` tutarlılık
#   seviyesiyle çalışır. JVM + Memtable + Key/Row Cache nedeniyle prod'da düğüm
#   başına 16–64 GB RAM (8–16 GB JVM Heap) tahsis edilir.
# - Lab'da: `vm-worker-data` (`Standard_B2s` - 4 GB RAM) üzerinde Kafka ve
#   PostgreSQL ile birlikte çalıştığı için, Cassandra'nın varsayılan olarak
#   sistem belleğinin yarısını (~2 GB) Heap olarak yutup `OOMKilled` olmasına
#   engel olmak zorundayız!
#   Bu yüzden sözleşmedeki bilinçli lab kısıtıyla:
#     * `jvm.maxHeapSize: "768M"` (`MAX_HEAP_SIZE=768M`)
#     * `jvm.newHeapSize: "128M"` (`HEAP_NEWSIZE=128M`)
#     * `replicaCount: 1` (Tek düğüm, `SimpleStrategy`, `RF=1`)
#   olarak sınırlandırılmıştır.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PROJE 4 DERS 2: BITNAMI LEGACY İMAJ DEPOSU VE GÜVENLİK İZNİ
# ------------------------------------------------------------------------------
global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/cassandra

# ------------------------------------------------------------------------------
# 2. KÜME BOYUTU VE KİMLİK DOĞRULAMA (SÖZLEŞME STANDARTLARI)
# ------------------------------------------------------------------------------
# Küme içi DNS: `cassandra.data.svc.cluster.local:9042`
replicaCount: 1

dbUser:
  user: "resilience"
  password: "AdminPassword2026!"

# ------------------------------------------------------------------------------
# 3. JVM HEAP BELLEK SINIRLANDIRMASI (MAX_HEAP_SIZE=768M, HEAP_NEWSIZE=128M)
# ------------------------------------------------------------------------------
# ÇOK KRİTİK: Cassandra başlangıç betiği (`cassandra-env.sh`), `MAX_HEAP_SIZE`
# ve `HEAP_NEWSIZE` ikilisinin BİRLİKTE tanımlanmasını şart koşar; yalnızca biri
# verilirse Cassandra başlamayı reddeder! Hem chart'ın `jvm` bloğunu hem de
# `extraEnvVars` ortam değişkenlerini birlikte tanımlayarak %100 garanti sağlıyoruz.
jvm:
  maxHeapSize: "768M"
  newHeapSize: "128M"

extraEnvVars:
  - name: MAX_HEAP_SIZE
    value: "768M"
  - name: HEAP_NEWSIZE
    value: "128M"

# ------------------------------------------------------------------------------
# 4. KAYNAK KISITLAMALARI VE BAŞLANGIÇ PROBE TOLERANSI
# ------------------------------------------------------------------------------
# Cassandra JVM + CQL başlatması 60-120 saniye sürebildiği için liveness/readiness
# başlangıç gecikmelerini (initialDelaySeconds) geniş tutuyoruz.
resourcesPreset: "none"

resources:
  requests:
    cpu: 150m
    memory: 900Mi
  limits:
    cpu: 800m
    memory: 1400Mi

livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 6

# ------------------------------------------------------------------------------
# 5. DÜĞÜM SEÇİCİ VE TAINT TOLERASYONU (VM-WORKER-DATA İZOLASYONU)
# ------------------------------------------------------------------------------
nodeSelector:
  tier: data

tolerations:
  - key: dedicated
    operator: Equal
    value: data
    effect: NoSchedule

# ------------------------------------------------------------------------------
# 6. KALICI DEPOLAMA (PERSISTENCE — SSTABLES & COMMITLOG)
# ------------------------------------------------------------------------------
persistence:
  enabled: true
  size: 5Gi
