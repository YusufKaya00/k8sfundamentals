apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-job
  namespace: production
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid         # Önceki yedek bitmeden yenisini başlatmaz
  successfulJobsHistoryLimit: 3     # Başarılı son 3 pod kaydını tutar
  failedJobsHistoryLimit: 1         # Hatalı son 1 pod kaydını tutar
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: db-backup
        spec:
          restartPolicy: OnFailure
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "production"
              effect: "NoSchedule"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: environment
                        operator: In
                        values:
                          - production
          containers:
            - name: postgres-backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TARGET_DB="${POSTGRES_DB:-postgres}"
                  BACKUP_FILE="/backups/backup-${TARGET_DB}-$(date +%Y%m%d_%H%M%S).sql"

                  echo "[$(date)] PostgreSQL ($DB_HOST:$DB_PORT) için '$TARGET_DB' veritabanı yedeği başlatılıyor..."

                  # Çıktı PVC'nin mount edildiği /backups dizinine yazılır
                  pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" "$TARGET_DB" > "$BACKUP_FILE"

                  BACKUP_SIZE=$(wc -c < "$BACKUP_FILE")
                  echo "[$(date)] YEDEKLEME BAŞARILI: '$BACKUP_FILE' oluşturuldu (${BACKUP_SIZE} bayt)."
              env:
                - name: DB_HOST
                  value: "postgres-service"
                - name: DB_PORT
                  value: "5432"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_DB
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc