apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-frontend
  template:
    metadata:
      labels:
        app: wordpress-frontend
    spec:
      nodeSelector:
        kubernetes.io/role: worker1
      containers:
        - name: wordpress
          image: wordpress:latest
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "500Mi"
              cpu: "500m" 
          env:
            - name: WORDPRESS_DB_HOST
              value: backend:3306
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: db_username
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: db_password
            - name: WORDPRESS_DB_NAME
              value: wordpress
          volumeMounts:
            - name: wordpress-storage
              mountPath: /var/www/html
      tolerations:
            - key: platform
              operator: Equal
              value: production
              effect: NoSchedule

      volumes:
        - name: wordpress-storage
          persistentVolumeClaim:
           claimName: wordpressclaim