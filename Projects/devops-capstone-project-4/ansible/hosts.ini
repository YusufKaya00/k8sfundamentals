# ==============================================================================
# OMNISTREAM ENTERPRISE PLATFORM - AUTO-GENERATED ANSIBLE INVENTORY
# ==============================================================================
# Bu dosya Terraform `local_file.ansible_inventory` kaynağı ve `templatefile()`
# fonksiyonu tarafından otomatik olarak üretilmiştir. Manuel olarak düzenlemeyiniz!
#
# BASTION / JUMP HOST (ProxyCommand) MİMARİSİ:
# Özel alt ağdaki (`10.20.1.0/24`) veritabanı ve Kafka düğümlerinin (`10.20.1.5-7`)
# güvenlik (Zero-Trust) ve Azure 3 Public IP kotası nedeniyle dış dünyaya açık
# Public IP adresleri yoktur. Ansible kontrol makinesi bu özel düğümlere bağlanırken
# `vm-master` (9.205.30.164) düğümünü bir SSH Atlama Sunucusu (Jump Host)
# olarak kullanır ve `-W %h:%p` parametresiyle şifreli SSH tüneli içinden geçer.
# ==============================================================================

[master]
vm-master ansible_host=9.205.30.164 private_ip=10.20.1.4 node_role=control-plane

[workers]
vm-worker-app ansible_host=10.20.1.8 private_ip=10.20.1.8 worker_tier=app
vm-worker-nosql ansible_host=10.20.1.7 private_ip=10.20.1.7 worker_tier=db-nosql
vm-worker-sql ansible_host=10.20.1.6 private_ip=10.20.1.6 worker_tier=db-sql
vm-worker-stream ansible_host=10.20.1.5 private_ip=10.20.1.5 worker_tier=stream

[k8s_cluster:children]
master
workers

[all:vars]
ansible_user=ysf
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
master_private_ip=10.20.1.4
master_public_ip=9.205.30.164
app_public_ip=9.205.30.202

# ------------------------------------------------------------------------------
# Özel Alt Ağdaki Worker Düğümleri İçin SSH Bastion / Jump Host Tünel Ayarı
# ------------------------------------------------------------------------------
# `-o ProxyCommand="ssh ... -W %h:%p ysf@9.205.30.164"`
# Ansible, `10.20.1.5`, `10.20.1.6`, `10.20.1.7` ve `10.20.1.8` özel IP'lerine
# bağlanmak istediğinde önce `vm-master` genel IP'sine SSH açar ve standart girdi/çıktıyı
# (`-W %h:%p`) hedef Worker düğümünün 22 portuna şeffaf biçimde yönlendirir.
[workers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -W %h:%p ysf@9.205.30.164"'
