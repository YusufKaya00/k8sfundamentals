# ==============================================================================
# OMNISTREAM KURUMSAL DEVSECOPS & GITOPS BORU HATTI (.gitlab-ci.yml)
# ==============================================================================
# Mimari Akış (4 Aşamalı Zero-Trust DevSecOps Pipeline):
#
#   [1. build]          -> Rootless Buildah (`quay.io/buildah/stable`) ile Docker
#                          daemon gerektirmeden (Daemonless) OCI konteyner imajı
#                          derlenir ve sonraki aşamalara aktarılmak üzere `.tar`
#                          arşivi (artifact) olarak kaydedilir.
#   [2. scan]           -> Aqua Security Trivy (`aquasec/trivy:latest`) ile derlenen
#                          imaj arşivi taranır. Hem OS paketlerindeki (Debian) hem de
#                          Python kütüphanelerindeki `HIGH` ve `CRITICAL` CVE
#                          zafiyetleri denetlenir ve JSON/Tablo raporu üretilir.
#   [3. push]           -> Güvenlik taramasından başarıyla geçen (Verified) imaj,
#                          Docker Hub (`docker.io/$DOCKERHUB_USERNAME/omnistream-app`)
#                          üzerine hem `$CI_COMMIT_SHORT_SHA` hem de `:latest`
#                          etiketleriyle (tag) gönderilir.
#   [4. gitops-promote] -> Git deposu klonlanır, Helm Chart içindeki
#                          `Projects/devops-capstone-project-4/app/omnistream-chart/values.yaml`
#                          dosyasında `image.repository` ve `image.tag` değerleri
#                          `sed`/`yq` ile yeni `$CI_COMMIT_SHORT_SHA` sürümüne güncellenir,
#                          sonsuz döngüyü önlemek için `[skip ci]` mesajıyla commit/push
#                          yapılır. Küme içindeki ArgoCD bu değişikliği algılayarak
#                          yeni sürümü otomatik olarak RKE2 kümesine yayar (Rollout)!
#
# Gerekli GitLab CI/CD Variables (Settings -> CI/CD -> Variables):
# - DOCKERHUB_USERNAME : Docker Hub kullanıcı adınız (Örn: yusufk00)
# - DOCKERHUB_TOKEN    : Docker Hub Access Token (Read/Write yetkili)
# - GIT_PUSH_TOKEN     : Git deposuna yazma yetkili Personal Access Token (PAT)
# ==============================================================================

stages:
  - build
  - scan
  - push
  - gitops-promote

variables:
  # Proje alt dizini ve imaj isimlendirme değişkenleri
  PROJECT_DIR: "Projects/devops-capstone-project-4"
  APP_DIR: "Projects/devops-capstone-project-4/app"
  CHART_VALUES_FILE: "Projects/devops-capstone-project-4/app/omnistream-chart/values.yaml"
  IMAGE_NAME: "docker.io/${DOCKERHUB_USERNAME}/omnistream-app"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  IMAGE_ARCHIVE: "omnistream-app-${CI_COMMIT_SHORT_SHA}.tar"
  # Kubernetes pod'ları içinde Buildah'ın ek çekirdek yetkisi olmadan çalışabilmesi
  # için dosya sistemi tabanlı `vfs` depolama sürücüsü kullanılır.
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "oci"
  BUILDAH_ISOLATION: "chroot"

# ==============================================================================
# AŞAMA 1: CONTAINER BUILD (DAEMONLESS BUILDAH)
# ==============================================================================
# Neden Docker-in-Docker (DinD) yerine Buildah?
# DinD çalışmak için `privileged: true` (root) konteynerlara ihtiyaç duyar ve
# bu durum Kubernetes worker düğümünde (`vm-worker-app`) büyük bir güvenlik açığıdır.
# Buildah ise arka planda çalışan bir daemon gerektirmeden imajı güvenli şekilde
# derler ve Trivy taraması için `oci-archive` (.tar) olarak diske yazar.
# ==============================================================================
build_image:
  stage: build
  image: quay.io/buildah/stable:latest
  script:
    - echo "🔨 [1/4] Buildah ile güvenli (Daemonless) OCI konteyner imajı derleniyor..."
    - buildah version
    - |
      if [ -d "${APP_DIR}" ]; then
        BUILD_CONTEXT="${APP_DIR}"
      else
        BUILD_CONTEXT="app"
      fi
    - buildah bud --storage-driver=${STORAGE_DRIVER} --format=${BUILDAH_FORMAT} --isolation=${BUILDAH_ISOLATION} -t "${IMAGE_NAME}:${IMAGE_TAG}" -t "${IMAGE_NAME}:latest" -f "${BUILD_CONTEXT}/Dockerfile" "${BUILD_CONTEXT}"
    - echo "📦 Derlenen imaj Trivy güvenlik taraması ve Push aşamaları için .tar arşivine aktarılıyor..."
    - buildah push --storage-driver=${STORAGE_DRIVER} "${IMAGE_NAME}:${IMAGE_TAG}" "docker-archive:${IMAGE_ARCHIVE}:${IMAGE_NAME}:${IMAGE_TAG}"
    - ls -lh "${IMAGE_ARCHIVE}"
  artifacts:
    name: "omnistream-image-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "${IMAGE_ARCHIVE}"
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - when: on_success

# ==============================================================================
# AŞAMA 2: DEVSECOPS VULNERABILITY SCAN (AQUA TRIVY)
# ==============================================================================
# Shift-Left Security (Güvenliği Sola Kaydırma):
# İmaj henüz Docker Hub'a gönderilmeden ve RKE2 kümesine dağıtılmadan ÖNCE
# Trivy tarafından taranır. Hem taban imaj (Debian 12 slim) hem de Python
# paketleri (`requirements.txt`) içindeki `HIGH` ve `CRITICAL` güvenlik açıkları
# raporlanır ve denetim (compliance) kanıtı olarak artifact şeklinde saklanır.
# ==============================================================================
trivy_security_scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: build_image
      artifacts: true
  script:
    - 'echo "🛡️ [2/4] Trivy ile konteyner imajı HIGH ve CRITICAL zafiyetlere karşı taranıyor..."'
    - trivy --version
    - trivy image --input "${IMAGE_ARCHIVE}" --severity HIGH,CRITICAL --format json --output trivy-vulnerability-report.json
    - trivy image --input "${IMAGE_ARCHIVE}" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0
    - 'echo "✅ Trivy güvenlik taraması tamamlandı. Rapor: trivy-vulnerability-report.json"'
  artifacts:
    name: "trivy-report-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - trivy-vulnerability-report.json
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - when: on_success

# ==============================================================================
# AŞAMA 3: CONTAINER REGISTRY PUSH (DOCKER HUB)
# ==============================================================================
# Trivy taramasından geçen doğrulanmış (verified) imaj arşivi, Buildah ile
# Docker Hub (`docker.io/$DOCKERHUB_USERNAME/omnistream-app`) kayıt defterine
# hem commit SHA etiketiyle (`:$CI_COMMIT_SHORT_SHA`) hem de `:latest` olarak itilir.
# ==============================================================================
push_to_dockerhub:
  stage: push
  image: quay.io/buildah/stable:latest
  needs:
    - job: build_image
      artifacts: true
    - job: trivy_security_scan
  script:
    - 'echo "🚀 [3/4] Doğrulanmış imaj Docker Hub kayıt defterine yükleniyor..."'
    - buildah login -u "${DOCKERHUB_USERNAME}" -p "${DOCKERHUB_TOKEN}" docker.io
    - buildah pull --storage-driver=${STORAGE_DRIVER} "docker-archive:${IMAGE_ARCHIVE}"
    - buildah push --storage-driver=${STORAGE_DRIVER} "${IMAGE_NAME}:${IMAGE_TAG}" "docker://${IMAGE_NAME}:${IMAGE_TAG}"
    - buildah push --storage-driver=${STORAGE_DRIVER} "${IMAGE_NAME}:${IMAGE_TAG}" "docker://${IMAGE_NAME}:latest"
    - 'echo "✅ İmaj başarıyla yayınlandı: ${IMAGE_NAME}:${IMAGE_TAG} ve ${IMAGE_NAME}:latest"'
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - when: on_success

# ==============================================================================
# AŞAMA 4: GITOPS PROMOTE (HELM VALUES GÜNCELLEME & ARGOCD TETİKLEME)
# ==============================================================================
# GitOps Prensibi:
# CI boru hattı Kubernetes kümesine doğrudan dokunmaz (`kubectl` çalıştırmaz).
# Bunun yerine Git deposundaki `values.yaml` dosyasının `image.tag` alanını yeni
# derlenen `$CI_COMMIT_SHORT_SHA` ile günceller ve `[skip ci]` etiketiyle
# Git'e pushlar. Küme içindeki ArgoCD bu commit'i tespit ederek yeni imajı
# Sıfır Kesinti (RollingUpdate) ile `vm-worker-app` düğümüne dağıtır!
# ==============================================================================
gitops_promote:
  stage: gitops-promote
  image: alpine:3.20
  needs:
    - job: push_to_dockerhub
  before_script:
    - apk add --no-cache git sed yq
    - git config --global user.name "OmniStream GitOps Bot"
    - git config --global user.email "gitops-bot@omnistream.local"
  script:
    - 'echo "🔄 [4/4] GitOps Manifestosu (values.yaml) yeni imaj etiketiyle güncelleniyor..."'
    - |
      if [ -f "${CHART_VALUES_FILE}" ]; then
        TARGET_VALUES="${CHART_VALUES_FILE}"
      else
        TARGET_VALUES="app/omnistream-chart/values.yaml"
      fi
    - 'echo "Hedef Helm values dosyası: ${TARGET_VALUES}"'
    # yq / sed kullanarak image.repository ve image.tag alanlarını yeni imajla güncelle
    - sed -i "s|repository:.*|repository: ${DOCKERHUB_USERNAME}/omnistream-app|g" "${TARGET_VALUES}"
    - sed -i "s|tag:.*|tag: \"${IMAGE_TAG}\"|g" "${TARGET_VALUES}"
    - 'echo "📄 Güncellenmiş ${TARGET_VALUES} içeriği:"'
    - grep -n -A 4 "image:" "${TARGET_VALUES}"
    # Değişikliği commit et ve [skip ci] ile sonsuz pipeline döngüsünü engelle
    - git add "${TARGET_VALUES}"
    - |
      if git diff --cached --quiet; then
        echo "ℹ️ values.yaml zaten güncel, yeni commit gerekmiyor."
      else
        git commit -m "chore(gitops): promote omnistream-app image to ${IMAGE_TAG} [skip ci]"
        if [ -n "${GITLAB_ACCESS_TOKEN}" ]; then
          CLEAN_REPO_URL=$(echo "${CI_REPOSITORY_URL}" | sed -E 's|https?://[^@]+@||')
          git push "https://oauth2:${GITLAB_ACCESS_TOKEN}@${CLEAN_REPO_URL}" "HEAD:${CI_COMMIT_REF_NAME}"
        else
          echo "⚠️ GITLAB_ACCESS_TOKEN tanımlı değil, yerel commit oluşturuldu (ArgoCD senkronizasyonu için GITLAB_ACCESS_TOKEN ekleyin)."
        fi
      fi
    - echo "🎯 GitOps Promote tamamlandı! ArgoCD yeni sürümü (${IMAGE_TAG}) otomatik olarak RKE2 kümesine uygulayacak."
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - when: on_success
