# ==============================================================================
# OMNISTREAM KUBERNETES INGRESS ŞABLONU (templates/ingress.yaml)
# ==============================================================================
# RKE2 ile yerleşik gelen NGINX Ingress Controller (`ingressClassName: nginx`),
# `app.<APP_IP>.nip.io` adresine gelen HTTP isteklerini karşılar ve küme içindeki
# `omnistream-app` ClusterIP servisine yönlendirir.
# ==============================================================================
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    {{- if .Values.ingress.hosts }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Chart.Name }}
                port:
                  number: {{ $.Values.service.port | default 80 }}
          {{- end }}
    {{- end }}
    {{- else }}
    - host: {{ .Values.ingress.host | default "app.APP_IP.nip.io" | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: {{ .Values.service.port | default 80 }}
    {{- end }}
{{- end }}
