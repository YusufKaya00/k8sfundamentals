[master]
vm-master ansible_host=9.205.89.222 ansible_user=ysf

[workers]
vm-worker-app   ansible_host=10.10.1.8 ansible_user=ysf node_role=app      public_ip=9.205.89.214
vm-worker-infra ansible_host=10.10.1.5 ansible_user=ysf node_role=infra
vm-worker-pg    ansible_host=10.10.1.6 ansible_user=ysf node_role=db-sql
vm-worker-mongo ansible_host=10.10.1.7 ansible_user=ysf node_role=db-nosql

[all:vars]
ansible_user=ysf
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
master_public_ip=9.205.89.222
app_worker_public_ip=9.205.89.214

[workers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ysf@9.205.89.222"'
