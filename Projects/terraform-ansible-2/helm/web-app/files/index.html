<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud-Native Multi-Node Lab</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 600px; border: 1px solid #334155; }
    h1 { color: #38bdf8; margin-bottom: 1rem; font-size: 1.8rem; }
    p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; }
    .badge { display: inline-block; padding: 0.35rem 0.85rem; background: #0284c7; color: white; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Azure + Terraform + Ansible + Helm Success! 🚀</h1>
    <p>This web application is running on a multi-node K3s cluster provisioned with Terraform, configured with Ansible, and deployed via Helm.</p>
    <div class="badge">Multi-Node K3s on Azure</div>
  </div>
</body>
</html>
