architecture: standalone
auth:
  rootPassword: "MongoRootPassword123!"
  usernames: ["appuser"]
  passwords: ["AppMongoPassword123!"]
  databases: ["appdb"]
nodeSelector:
  tier: db-nosql
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "db-nosql"
    effect: "NoSchedule"
persistence:
  enabled: true
  size: 4Gi
resources:
  requests:
    memory: 256Mi
    cpu: 150m
  limits:
    memory: 800Mi
    cpu: 600m
