global:
  nodeSelector:
    tier: web

# Harici SSO / OAuth modülünü kapat
dex:
  enabled: false

# Bildirim motorunu kapat
notifications:
  enabled: false

# Çoklu küme şablonlayıcısını kapat
applicationSet:
  enabled: false

# Önbellek katmanı: HA yerine tek replika
redis:
  enabled: true

# API & Web UI Sunucusu
server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Git Manifest Render Sunucusu
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

# GitOps Uzlaştırma (Reconciliation) Motoru
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi