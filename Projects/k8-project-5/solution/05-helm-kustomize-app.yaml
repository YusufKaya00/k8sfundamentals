apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secured-helm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.6.2
    helm:
      values: |
        replicaCount: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        nodeSelector:
          tier: web
      # Upstream chart'i fork'lamadan sirket guvenlik kurallarini post-render eden yama
      ignoreMissingValueFiles: false
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
