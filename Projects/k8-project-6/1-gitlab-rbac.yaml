apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
  labels:
    tier: devops
    app.kubernetes.io/part-of: gitlab-ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-sa
  namespace: gitlab-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-role
  namespace: gitlab-runner
rules:
  # Dinamik pod yaşam döngüsü yönetimi
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/attach", "pods/log", "pods/status"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Konfigürasyon ve kimlik doğrulama verileri
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  # CI işleri arasında servis/bağımlılık iletişimi gerekirse
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-rolebinding
  namespace: gitlab-runner
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-sa
    namespace: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-role