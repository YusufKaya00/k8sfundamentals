apiVersion: v1
kind: ServiceAccount
metadata:
  name: helix-api
  namespace: helix-prod
  labels:
    app.kubernetes.io/name: helix-api
    app.kubernetes.io/part-of: helix
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helix-endpoint-reader
  namespace: helix-prod
  labels:
    app.kubernetes.io/part-of: helix
rules:
  - apiGroups: ["apps"]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helix-api-endpoint-reader
  namespace: helix-prod
  labels:
    app.kubernetes.io/part-of: helix
subjects:
  - kind: ServiceAccount
    name: helix-api
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helix-endpoint-reader
