apiVersion: v1
kind: Service
metadata:
  name: helix-gateway
  namespace: helix-prod
  labels:
    app.kubernetes.io/name: helix-gateway
    app.kubernetes.io/part-of: helix
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: helix-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30880
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-gateway
  namespace: helix-prod
  labels:
    app.kubernetes.io/name: helix-gateway
    app.kubernetes.io/part-of: helix
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helix-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helix-gateway
        app.kubernetes.io/part-of: helix
        tier: web
    spec:
      nodeSelector:
        tier: frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: helix-gateway
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: helix-gateway-nginx
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-html
          configMap:
            name: helix-gateway-nginx
            items:
              - key: index.html
                path: index.html
