apiVersion: v1
kind: ConfigMap
metadata:
  name: helix-api-code
  namespace: helix-prod
  labels:
    app.kubernetes.io/part-of: helix
data:
  app.py: |
    import json, os, socket, sys, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    print("helix-api: bootstrapping runtime", flush=True)
    time.sleep(10)

    required = ["DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD"]
    missing = [k for k in required if not os.environ.get(k)]
    if missing:
        print(f"FATAL: configuration validation failed, unset variables: {missing}", flush=True)
        sys.exit(1)

    print("helix-api: configuration valid, warming ledger caches", flush=True)
    time.sleep(20)

    DB_HOST = os.environ["DB_HOST"]
    DB_PORT = int(os.environ["DB_PORT"])
    APP_PORT = int(os.environ.get("APP_PORT", "8080"))

    def db_reachable():
        try:
            socket.create_connection((DB_HOST, DB_PORT), timeout=2).close()
            return True
        except OSError as exc:
            print(f"readiness: database {DB_HOST}:{DB_PORT} unreachable: {exc}", flush=True)
            return False

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body):
            payload = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                self._send(200, {"status": "alive"})
            elif self.path == "/ready":
                ok = db_reachable()
                self._send(200 if ok else 503, {"database": "up" if ok else "down"})
            elif self.path.startswith("/api/"):
                self._send(200, {"service": "helix-api", "pod": socket.gethostname(), "database": "up" if db_reachable() else "down"})
            else:
                self._send(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            pass

    print(f"helix-api: listening on :{APP_PORT}", flush=True)
    HTTPServer(("0.0.0.0", APP_PORT), Handler).serve_forever()
  discovery.py: |
    import json, os, ssl, sys, time, urllib.error, urllib.request

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    TARGET = os.environ.get("DISCOVERY_TARGET", "helix-db")
    INTERVAL = int(os.environ.get("DISCOVERY_INTERVAL", "15"))
    API = "https://kubernetes.default.svc"

    try:
        token = open(f"{SA_DIR}/token").read().strip()
        namespace = open(f"{SA_DIR}/namespace").read().strip()
    except FileNotFoundError as exc:
        print(f"FATAL: service account credentials not found: {exc}", flush=True)
        sys.exit(1)

    ctx = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
    url = f"{API}/api/v1/namespaces/{namespace}/endpoints/{TARGET}"

    while True:
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
                data = json.load(resp)
            ips = [a["ip"] for s in data.get("subsets", []) for a in s.get("addresses", [])]
            print(f"discovery: {TARGET} backends={ips}", flush=True)
            open("/tmp/discovery.ok", "w").write(json.dumps(ips))
        except urllib.error.HTTPError as exc:
            print(f"FATAL: kubernetes api returned {exc.code}: {exc.read().decode()[:300]}", flush=True)
            sys.exit(1)
        except Exception as exc:
            print(f"discovery: transient error: {exc}", flush=True)
        time.sleep(INTERVAL)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helix-gateway-nginx
  namespace: helix-prod
  labels:
    app.kubernetes.io/part-of: helix
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://helix-api:8080;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Helix Ledger</title></head>
    <body><h1>Helix Ledger Platform</h1><p>Status: <a href="/api/status">/api/status</a></p></body>
    </html>
