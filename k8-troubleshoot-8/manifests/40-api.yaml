apiVersion: v1
kind: Service
metadata:
  name: helix-api
  namespace: helix-prod
  labels:
    app.kubernetes.io/name: helix-api
    app.kubernetes.io/part-of: helix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helix-api
    tier: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-api
  namespace: helix-prod
  labels:
    app.kubernetes.io/name: helix-api
    app.kubernetes.io/part-of: helix
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helix-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helix-api
        app.kubernetes.io/part-of: helix
        tier: backend
    spec:
      serviceAccountName: helix-api
      nodeSelector:
        tier: web
      containers:
        - name: api
          image: docker.io/library/python:3.12-slim
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: helix-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: helix-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helix-db-credentials
                  key: password
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
        - name: discovery
          image: docker.io/library/python:3.12-slim
          command: ["python", "-u", "/app/discovery.py"]
          envFrom:
            - configMapRef:
                name: helix-config
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/discovery.ok"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: helix-api-code
