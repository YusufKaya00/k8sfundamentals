# =============================================================================
# 06-07-web-deployment.yaml
# OCI OKE Production Laboratuvarı: Yüksek Erişilebilirlikli Web API Deployment
# - InitContainer: PostgreSQL veritabanı portu (5432) açılana kadar bekler
# - 2 Replika, 2 ayrı web node'una dengeli dağılım:
#   * nodeSelector: tier=web (DB node'una gitmez)
#   * podAntiAffinity: hostname bazlı
#   * topologySpreadConstraints: maxSkew: 1, topologyKey: kubernetes.io/hostname
# - Sağlık Kontrolleri: startupProbe, readinessProbe, livenessProbe
# - Graceful Shutdown / Connection Drain: lifecycle.preStop (sleep 10)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-api-code
  namespace: production
  labels:
    app: web-api
    environment: production
data:
  server.py: |
    import json
    import logging
    import math
    import os
    import socket
    import sys
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PORT = int(os.getenv("PORT", "8080"))
    LOG_LEVEL = os.getenv("LOG_LEVEL", "INFO").upper()
    APP_ENV = os.getenv("APP_ENV", "production")
    DB_HOST = os.getenv("DB_HOST", "postgres")
    DB_PORT = int(os.getenv("DB_PORT", "5432"))
    HOSTNAME = socket.gethostname()

    logging.basicConfig(level=getattr(logging, LOG_LEVEL, logging.INFO),
                        format="%(asctime)s [%(levelname)s] %(message)s")
    log = logging.getLogger("web-api")

    def check_db():
        try:
            with socket.create_connection((DB_HOST, DB_PORT), timeout=2):
                return True
        except Exception:
            return False

    class RequestHandler(BaseHTTPRequestHandler):
        def _send(self, status, data):
            body = json.dumps(data).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            path = self.path.split("?")[0]
            if path in ("/healthz", "/ready"):
                self._send(200, {"status": "healthy", "pod": HOSTNAME})
            elif path == "/db":
                db_ok = check_db()
                self._send(200 if db_ok else 503, {
                    "pod": HOSTNAME,
                    "db_host": DB_HOST,
                    "db_port": DB_PORT,
                    "db_connected": db_ok
                })
            elif path == "/burn":
                # HPA yük testi için CPU tüketimi oluşturan matematiksel döngü
                start = time.time()
                total = sum(math.sqrt(i) for i in range(1, 300000))
                self._send(200, {
                    "pod": HOSTNAME,
                    "result": round(total, 2),
                    "duration_ms": round((time.time() - start) * 1000, 2)
                })
            elif path == "/":
                self._send(200, {
                    "message": "OCI OKE Production Web API",
                    "environment": APP_ENV,
                    "pod": HOSTNAME,
                    "db_connected": check_db()
                })
            else:
                self._send(404, {"error": "Not Found", "path": path})

        def log_message(self, fmt, *args):
            log.debug("%s - %s", self.address_string(), fmt % args)

    if __name__ == "__main__":
        log.info("Web API başlatılıyor... Port: %s, Pod: %s", PORT, HOSTNAME)
        server = ThreadingHTTPServer(("0.0.0.0", PORT), RequestHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: production
  labels:
    app: web-api
    tier: frontend
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-api
  template:
    metadata:
      labels:
        app: web-api
        tier: frontend
        environment: production
    spec:
      # Sadece tier=web etiketli OCI worker node'larda çalış
      nodeSelector:
        tier: web

      # 2 replikanın 2 farklı worker node'a düşmesi için Pod Anti-Affinity
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: web-api

      # Pod'ların worker node'lar arasında dengeli dağılmasını garanti eden kısıt
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-api

      # preStop sleep 10 + TCP fin paketlerinin tamamlanması için güvenli süre
      terminationGracePeriodSeconds: 30

      # Veritabanı ayağa kalkmadan ana container'ın başlamasını engelleyen InitContainer
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              echo "[init] PostgreSQL (${DB_HOST}:${DB_PORT}) dinleniyor..."
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -t 2; do
                echo "[init] PostgreSQL henüz hazır değil, 2 saniye bekleniyor..."
                sleep 2
              done
              echo "[init] PostgreSQL bağlantısı başarılı! Web API başlatılıyor."
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: web-api
          image: python:3.12-alpine
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Yavaş başlayan container'ların erken kill edilmesini önleyen Startup Probe
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20

          # Servis trafiği almadan önce hazır olduğunu doğrulayan Readiness Probe
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3

          # Kilitlenen pod'ları tespit edip yeniden başlatan Liveness Probe
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3

          # Sıfır Kesinti (Zero-Downtime) & Connection Drain için preStop kancası
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10

          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true

      volumes:
        - name: app-code
          configMap:
            name: web-api-code
