# =============================================================================
# 04-config-and-secret.yaml
# OCI OKE Production Laboratuvarı: PostgreSQL Credentials & App ConfigMap
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: production
  labels:
    app: postgres
    environment: production
type: Opaque
stringData:
  POSTGRES_USER: "okeadmin"
  POSTGRES_PASSWORD: "OkeSecurePassword2026!"
  POSTGRES_DB: "productiondb"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
  labels:
    app: web-api
    environment: production
data:
  APP_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "productiondb"
  CACHE_ENABLED: "true"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
