apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-client-sa
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-event-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-event-reader-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: api-client-sa
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-event-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: api-client-pod
  namespace: production
spec:
  serviceAccountName: api-client-sa
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
