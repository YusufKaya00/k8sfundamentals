apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: production
  labels:
    app: web-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-api
  template:
    metadata:
      labels:
        app: web-api
        tier: web
    spec:
      # Yalnızca web node'larını hedefle
      nodeSelector:
        tier: web

      # İki pod'un farklı fiziksel worker node'lara düşmesini zorunlu kıl
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web-api
                topologyKey: "kubernetes.io/hostname"

      # Pod'ları iki web worker'ı arasında dengeli dağıt
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-api

      # PostgreSQL hazır olmadan web pod'unu başlatma
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "PostgreSQL bekleniyor..."
                sleep 2
              done
          envFrom:
            - secretRef:
                name: db-secret
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: web
          image: docker.io/library/nginx:alpine
          ports:
            - containerPort: 80
              name: http

          # Sağlık Kontrolleri
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 10
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # Kesintisiz güncelleme için graceful shutdown gecikmesi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi