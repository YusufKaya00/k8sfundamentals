apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: notification-dispatcher
    app.kubernetes.io/part-of: vortex
data:
  dispatcher.py: |
    import time
    import sys

    print("Starting notification dispatcher...", flush=True)

    template_cache = bytearray(45 * 1024 * 1024)
    print(f"Allocated template cache buffer of {len(template_cache) // (1024 * 1024)}MB.", flush=True)

    for i in range(5):
        print(f"Processing notification dispatch batch {i + 1}...", flush=True)
        time.sleep(1)

    print("Notification batch completed successfully.", flush=True)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-dispatcher
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: notification-dispatcher
    app.kubernetes.io/part-of: vortex
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: notification-dispatcher
            app.kubernetes.io/part-of: vortex
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            tier: web
          containers:
            - name: dispatcher
              image: docker.io/library/python:3.12-slim
              command: ["python", "/app/dispatcher.py"]
              resources:
                requests:
                  memory: 16Mi
                  cpu: 20m
                limits:
                  memory: 32Mi
                  cpu: 100m
              volumeMounts:
                - name: config
                  mountPath: /app
          volumes:
            - name: config
              configMap:
                name: notification-config
