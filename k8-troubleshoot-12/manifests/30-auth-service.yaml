apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: vortex
data:
  PORT: "8081"
  DB_HOST: "vortex-db"
  DB_PORT: "5432"
  DB_NAME: "vortex_db"
  DB_USER: "vortex_admin"
  REDIS_HOST: "cache-service"
  REDIS_PORT: "6379"
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json
    import os
    import socket
    import sys

    PORT = int(os.environ.get("PORT", "8081"))
    DB_HOST = os.environ.get("DB_HOST", "vortex-db")
    DB_PORT = int(os.environ.get("DB_PORT", "5432"))
    REDIS_HOST = os.environ.get("REDIS_HOST", "cache-service")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))

    def check_tcp(host, port, timeout=2.0):
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(timeout)
            s.connect((host, port))
            s.close()
            return True, "connected"
        except Exception as e:
            return False, str(e)

    class AuthHandler(BaseHTTPRequestHandler):
        def _send_json(self, code, payload):
            data = json.dumps(payload, indent=2).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/healthz":
                self._send_json(200, {"status": "healthy", "service": "auth-service"})
                return

            if self.path == "/ready":
                db_ok, db_err = check_tcp(DB_HOST, DB_PORT)
                redis_ok, redis_err = check_tcp(REDIS_HOST, REDIS_PORT)
                ready = db_ok and redis_ok
                status_code = 200 if ready else 503
                self._send_json(status_code, {
                    "ready": ready,
                    "database": {"host": DB_HOST, "port": DB_PORT, "reachable": db_ok, "detail": db_err},
                    "redis": {"host": REDIS_HOST, "port": REDIS_PORT, "reachable": redis_ok, "detail": redis_err}
                })
                return

            if self.path == "/verify":
                db_ok, db_err = check_tcp(DB_HOST, DB_PORT)
                redis_ok, redis_err = check_tcp(REDIS_HOST, REDIS_PORT)
                if not (db_ok and redis_ok):
                    self._send_json(503, {
                        "authenticated": False,
                        "error": "dependency_unavailable",
                        "database": {"host": DB_HOST, "port": DB_PORT, "reachable": db_ok, "detail": db_err},
                        "redis": {"host": REDIS_HOST, "port": REDIS_PORT, "reachable": redis_ok, "detail": redis_err}
                    })
                    return

                self._send_json(200, {
                    "authenticated": True,
                    "user": "vortex_user",
                    "status": "verified"
                })
                return

            self._send_json(404, {"error": "not_found", "path": self.path})

        def do_POST(self):
            if self.path == "/verify":
                self.do_GET()
                return
            self._send_json(404, {"error": "not_found", "path": self.path})

        def log_message(self, format, *args):
            sys.stdout.write("%s - - [%s] %s\n" % (self.address_string(), self.log_date_time_string(), format % args))
            sys.stdout.flush()

    if __name__ == "__main__":
        print(f"Starting auth-service on port {PORT}...", flush=True)
        server = HTTPServer(("0.0.0.0", PORT), AuthHandler)
        server.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: vortex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: vortex-prod
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: vortex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: vortex
        tier: web
    spec:
      nodeSelector:
        tier: web
      containers:
        - name: auth-service
          image: docker.io/library/python:3.12-slim
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vortex-db-secret
                  key: database-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app
      volumes:
        - name: config
          configMap:
            name: auth-service-config
