apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api-deployment
  namespace: production
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Pod başlamadan önce çalışacak init container bloğu
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "PostgreSQL servisinin (postgres-service:5432) açılması bekleniyor..."
              until nc -z -w 2 postgres-service 5432; do
                echo "Veritabanı henüz hazır değil, 2 saniye sonra tekrar denenecek..."
                sleep 2
              done
              echo "PostgreSQL bağlantısı başarılı, ana uygulama başlatılıyor."
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

      # Ana uygulama container'ı
      containers:
      
        - name: web-api
          image: python:3.11-slim
          command: ["python3", "-m", "http.server", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "production"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: environment
                    operator: In
                    values:
                      - production